# ポケット秘書 — Cloudflare の設定ファイル
# database_id は記入済み（2026-09-23・Cloudflare で作った保管庫 pocket-hisho）。ほかは書きかえ不要。

name = "pocket-hisho"
main = "src/index.js"
compatibility_date = "2025-05-01"

# アプリの画面ファイル（web/ の中身）をそのまま配る設定。
# 見つからないURLは index.html を返す＝どのページを開いてもアプリが立ち上がる。
[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"

# 予定とタスクの保管庫（D1）
# ↓ Cloudflare の画面で作った保管庫の「Database ID」を、database_id の "" の中に貼る。
#   例）database_id = "a1b2c3d4-5678-90ab-cdef-1234567890ab"
#   （手順は SETUP.md の②③。Cloudflare の自動公開には保管庫を作る権限が無いため、
#     保管庫だけは手で作ってIDをここに書く）
# 表（テーブル）は、はじめて動いたときにサーバーが自動で作る（src/schema.js）。
# 空のままでも手元のテスト（wrangler dev --local）は動く。
[[d1_databases]]
binding = "DB"
database_name = "pocket-hisho"
database_id = "e5839ee4-5a68-451e-ae81-e848ecfeb932"

# 1分ごとの見回り（時刻が来た予定の通知を送る）
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

# ※ 合言葉は、公開したあと最初にアプリを開いた人が画面で決めます。
#    （ここに書くとGitHubに残ってしまうため、ファイルには書かない）
#    どうしてもCloudflare側で決めたいときだけ、APP_PASS という秘密の値を登録すると
#    そちらが優先されます。
