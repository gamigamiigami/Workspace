# ポケット秘書 — Cloudflare の設定ファイル
# このファイルは書きかえなくて大丈夫です。

name = "pocket-hisho"
main = "src/index.js"
compatibility_date = "2025-05-01"

# アプリの画面ファイル（web/ の中身）をそのまま配る設定。
# 見つからないURLは index.html を返す＝どのページを開いてもアプリが立ち上がる。
[assets]
directory = "./web"
binding = "ASSETS"
not_found_handling = "single-page-application"

# 予定とタスクの保管庫
# database_id をわざと書いていない。書かないと、公開のときに
# 「pocket-hisho」という名前のデータベースを自動で作って（あればそれにつないで）くれる。
# 表（テーブル）も、はじめて動いたときにサーバーが自動で作る（src/schema.js）。
[[d1_databases]]
binding = "DB"
database_name = "pocket-hisho"

# 1分ごとの見回り（時刻が来た予定の通知を送る）
[triggers]
crons = ["* * * * *"]

[observability]
enabled = true

# ※ 合言葉は、公開したあと最初にアプリを開いた人が画面で決めます。
#    （ここに書くとGitHubに残ってしまうため、ファイルには書かない）
#    どうしてもCloudflare側で決めたいときだけ、APP_PASS という秘密の値を登録すると
#    そちらが優先されます。
