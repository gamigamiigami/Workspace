<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ToDo丸</title>
  <link rel="icon" href="data:image/svg+xml,<svg viewBox='0 0 64 64' xmlns='http://www.w3.org/2000/svg'><rect width='64' height='64' rx='14' fill='%23f5a623'/><circle cx='32' cy='32' r='18' fill='none' stroke='white' stroke-width='4.5'/><path d='M22 32 L29 39 L42 25' stroke='white' stroke-width='4.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
  <meta name="theme-color" content="#202020">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: #1e1e1e;
      min-height: 100vh;
      color: #fff;
      font-size: 13px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ===== ヘッダー ===== */
    .header {
      height: 36px;
      background: #2b2b2b;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      border-bottom: 1px solid #383838;
      user-select: none;
      flex-shrink: 0;
    }

    .header-icon svg { width: 16px; height: 16px; }

    .header-title {
      font-size: 13px;
      font-weight: 600;
      color: #e8e8e8;
      flex: 1;
    }

    .header-date { font-size: 11px; color: #666; }

    .btn-add {
      width: 26px;
      height: 26px;
      background: transparent;
      border: 1px solid #555;
      border-radius: 5px;
      color: #ccc;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.12s;
      line-height: 1;
    }
    .btn-add:hover { background: #f5a623; border-color: #f5a623; color: #fff; }

    /* ===== フィルターバー（検索 + カテゴリのみ）===== */
    .filterbar {
      height: 32px;
      background: #252525;
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 6px;
      border-bottom: 1px solid #333;
      flex-shrink: 0;
    }

    .search-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
    }
    .search-wrap::before {
      content: '🔍';
      position: absolute;
      left: 6px;
      font-size: 10px;
      pointer-events: none;
    }
    .search-box {
      width: 100%;
      height: 22px;
      padding: 0 6px 0 24px;
      background: #333;
      border: 1px solid #444;
      border-radius: 4px;
      color: #ccc;
      font-size: 11px;
      font-family: inherit;
      outline: none;
    }
    .search-box::placeholder { color: #666; }
    .search-box:focus { border-color: #666; }

    .cat-sel {
      height: 22px;
      padding: 0 6px;
      background: #333;
      border: 1px solid #444;
      border-radius: 4px;
      color: #bbb;
      font-size: 11px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
    }
    .cat-sel option { background: #333; }

    /* ===== ノートエリア ===== */
    .notes-area {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
    }

    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 8px;
    }

    /* ===== 空の状態 ===== */
    .empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 120px;
      color: #555;
      gap: 8px;
      grid-column: 1 / -1;
    }
    .empty svg { width: 30px; height: 30px; }
    .empty p   { font-size: 12px; }

    /* ===== ノートカード（タイトル＋締切日のみ）===== */
    .note-card {
      border-radius: 4px;
      padding: 12px 14px 10px;
      cursor: pointer;
      position: relative;
      transition: box-shadow 0.12s, transform 0.12s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.4);
      min-height: 72px;
      display: flex;
      flex-direction: column;
      color: #1a1a1a;
    }
    .note-card:hover {
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
      transform: translateY(-1px);
    }
    .note-card.completed { opacity: 0.4; }
    .note-card.overdue   { outline: 2px solid #ef5350; }

    /* カテゴリ別の背景色 */
    .nc-授業準備    { background: #FFF9C4; }
    .nc-校務        { background: #CCE4FF; }
    .nc-副業        { background: #E4D5FF; }
    .nc-プライベート { background: #C8ECC8; }
    .nc-その他      { background: #EFEFEF; }
    .nc-custom      { background: #FFD5D5; }

    /* 完了・削除ボタン（ホバー時のみ表示）*/
    .ok-btn, .del-btn {
      position: absolute;
      top: 4px;
      width: 18px;
      height: 18px;
      border: none;
      border-radius: 3px;
      background: rgba(0,0,0,0.1);
      color: #444;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.12s, background 0.12s;
      line-height: 1;
    }
    .del-btn { right: 4px; }
    .ok-btn  { right: 24px; }
    .note-card:hover .ok-btn,
    .note-card:hover .del-btn { opacity: 1; }
    .del-btn:hover { background: rgba(239,83,80,0.2) !important; color: #c62828; }
    .ok-btn:hover  { background: rgba(102,187,106,0.25) !important; color: #2e7d32; }

    /* カードテキスト */
    .note-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.4;
      word-break: break-word;
      padding-right: 14px;
      flex: 1;
    }
    .note-card.completed .note-title { text-decoration: line-through; color: #888; }

    .note-due {
      font-size: 10px;
      color: #666;
      margin-top: 6px;
    }
    .note-due.overdue { color: #c62828; font-weight: 700; }
    .note-due.today   { color: #e65100; font-weight: 700; }

    /* ===== モーダル ===== */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }
    .overlay.open { display: flex; }

    .modal {
      background: #2d2d2d;
      border-radius: 10px;
      width: 100%;
      max-width: 340px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      color: #e8e8e8;
      animation: pop 0.15s ease;
    }
    @keyframes pop {
      from { opacity: 0; transform: scale(0.95); }
      to   { opacity: 1; transform: scale(1); }
    }

    .modal-head {
      padding: 14px 16px 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .modal-head h2 { font-size: 14px; font-weight: 700; }

    .modal-close {
      width: 24px; height: 24px;
      border: none; border-radius: 5px;
      background: transparent; color: #888;
      font-size: 14px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.12s;
    }
    .modal-close:hover { background: #444; color: #fff; }

    .modal-body { padding: 14px 16px 4px; }

    .field { margin-bottom: 12px; }
    .field label {
      display: block; font-size: 11px; font-weight: 600;
      color: #999; margin-bottom: 4px; letter-spacing: 0.2px;
    }
    .field input, .field textarea {
      width: 100%;
      padding: 8px 10px;
      background: #383838;
      border: 1px solid #4a4a4a;
      border-radius: 6px;
      color: #e0e0e0;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.12s;
    }
    .field input:focus, .field textarea:focus {
      border-color: #f5a623; background: #3e3e3e;
    }
    .field textarea { resize: vertical; min-height: 64px; }
    .field-req { color: #ef5350; margin-left: 2px; }

    /* 色選択 */
    .color-pick { display: flex; gap: 6px; }
    .color-opt {
      width: 26px; height: 26px;
      border-radius: 4px;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.12s;
      position: relative;
    }
    .color-opt:hover { transform: scale(1.1); }
    .color-opt.sel { border-color: #fff; box-shadow: 0 0 0 1px rgba(255,255,255,0.3); }
    .color-opt.sel::after {
      content: '✓';
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: rgba(0,0,0,0.45);
    }

    .modal-foot {
      padding: 10px 16px 14px;
      display: flex; gap: 8px; justify-content: flex-end;
    }
    .btn-save {
      background: #f5a623; color: #fff; border: none;
      border-radius: 6px; padding: 7px 18px;
      font-size: 13px; font-weight: 700; font-family: inherit;
      cursor: pointer; transition: background 0.12s;
    }
    .btn-save:hover { background: #e09310; }
    .btn-cancel {
      background: #444; color: #ccc; border: none;
      border-radius: 6px; padding: 7px 14px;
      font-size: 13px; font-family: inherit;
      cursor: pointer; transition: background 0.12s;
    }
    .btn-cancel:hover { background: #505050; }

    /* ===== 削除確認 ===== */
    .confirm {
      background: #2d2d2d;
      border-radius: 10px;
      padding: 20px 18px 16px;
      width: 100%;
      max-width: 280px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
      color: #e0e0e0;
      animation: pop 0.15s ease;
    }
    .confirm h3 { font-size: 14px; margin-bottom: 8px; }
    .confirm p  { font-size: 12px; color: #888; margin-bottom: 18px; line-height: 1.5; }
    .confirm-btns { display: flex; gap: 8px; justify-content: center; }
    .btn-danger {
      background: #ef5350; color: #fff; border: none;
      border-radius: 6px; padding: 7px 16px;
      font-size: 13px; font-family: inherit;
      cursor: pointer; transition: background 0.12s;
    }
    .btn-danger:hover { background: #c62828; }

    /* ===== トースト ===== */
    #toast {
      position: fixed; bottom: 14px; left: 50%;
      transform: translateX(-50%) translateY(6px);
      background: #333; color: #e0e0e0;
      padding: 6px 14px; border-radius: 14px;
      font-size: 12px; opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      pointer-events: none; z-index: 999;
      white-space: nowrap; border: 1px solid #444;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #444; border-radius: 2px; }
  </style>
</head>
<body>

  <div id="toast"></div>

  <!-- ===== ヘッダー ===== -->
  <header class="header">
    <div class="header-icon">
      <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
        <rect width="64" height="64" rx="14" fill="#f5a623"/>
        <circle cx="32" cy="32" r="18" fill="none" stroke="white" stroke-width="5"/>
        <path d="M22 32 L29 39 L42 25" stroke="white" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="header-title">ToDo丸</span>
    <span class="header-date" id="header-date"></span>
    <button class="btn-add" id="btn-add" title="新規追加 (Ctrl+N)">＋</button>
  </header>

  <!-- ===== フィルターバー ===== -->
  <div class="filterbar">
    <div class="search-wrap">
      <input type="text" class="search-box" id="search-input" placeholder="検索...">
    </div>
    <select class="cat-sel" id="cat-filter">
      <option value="all">すべて</option>
    </select>
  </div>

  <!-- ===== ノートエリア ===== -->
  <div class="notes-area">
    <div class="notes-grid" id="notes-grid"></div>
  </div>

  <!-- ===== 追加・編集モーダル ===== -->
  <div class="overlay" id="task-modal">
    <div class="modal">
      <div class="modal-head">
        <h2 id="modal-title">新規ノート</h2>
        <button class="modal-close" id="modal-close">✕</button>
      </div>
      <div class="modal-body">

        <div class="field">
          <label>タイトル<span class="field-req">*</span></label>
          <input type="text" id="f-title" placeholder="やることを入力...">
        </div>

        <div class="field">
          <label>色</label>
          <div class="color-pick" id="color-pick"></div>
        </div>

        <div class="field">
          <label>締切日</label>
          <input type="date" id="f-due">
        </div>

        <div class="field">
          <label>メモ</label>
          <textarea id="f-memo" placeholder="備考・詳細..."></textarea>
        </div>

      </div>
      <div class="modal-foot">
        <button class="btn-cancel" id="modal-cancel">キャンセル</button>
        <button class="btn-save"   id="modal-save">保存</button>
      </div>
    </div>
  </div>

  <!-- ===== 削除確認 ===== -->
  <div class="overlay" id="confirm-modal">
    <div class="confirm">
      <h3>削除しますか？</h3>
      <p id="confirm-msg"></p>
      <div class="confirm-btns">
        <button class="btn-cancel" id="confirm-cancel">キャンセル</button>
        <button class="btn-danger" id="confirm-ok">削除</button>
      </div>
    </div>
  </div>

  <script>
    // ===== 定数 =====
    const NOTE_COLORS = [
      { id: '授業準備',    bg: '#FFF9C4' },
      { id: '校務',        bg: '#CCE4FF' },
      { id: '副業',        bg: '#E4D5FF' },
      { id: 'プライベート', bg: '#C8ECC8' },
      { id: 'その他',      bg: '#EFEFEF' },
      { id: 'custom',      bg: '#FFD5D5' },
    ];
    const STORAGE_KEY = 'sensei-todo-v1';

    // ===== 状態 =====
    let tasks        = [];
    let activeFilter = 'all';
    let searchText   = '';
    let editingId    = null;
    let deletingId   = null;

    // ===== 保存・読み込み =====
    function saveData() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ tasks })); }
      catch(e) {}
    }
    function loadData() {
      try {
        const d = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
        if (d && d.tasks) tasks = d.tasks;
      } catch(e) {}
    }

    // ===== 日付ユーティリティ =====
    function todayStr() {
      const d = new Date();
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    }
    function pad(n) { return String(n).padStart(2, '0'); }
    function fmtDate(s) {
      if (!s) return '';
      const [, m, d] = s.split('-');
      return `${parseInt(m)}/${parseInt(d)}`;
    }
    function dateStatus(s) {
      if (!s) return '';
      const t = todayStr();
      return s < t ? 'overdue' : s === t ? 'today' : '';
    }

    function getColor(catId) {
      return NOTE_COLORS.find(c => c.id === catId) || NOTE_COLORS[NOTE_COLORS.length - 1];
    }

    // ===== フィルタ & ソート =====
    function getVisible() {
      let list = tasks.filter(t => {
        if (activeFilter !== 'all' && t.category !== activeFilter) return false;
        if (searchText) {
          const q = searchText.toLowerCase();
          if (!t.title.toLowerCase().includes(q) &&
              !(t.memo || '').toLowerCase().includes(q)) return false;
        }
        return true;
      });
      list.sort((a, b) => {
        const da = a.dueDate || '9999', db = b.dueDate || '9999';
        return da !== db ? (da < db ? -1 : 1) : b.createdAt - a.createdAt;
      });
      return [...list.filter(t => !t.completed), ...list.filter(t => t.completed)];
    }

    // ===== カテゴリフィルタ描画 =====
    function renderCatFilter() {
      const sel = document.getElementById('cat-filter');
      const cur = sel.value;
      sel.innerHTML = '<option value="all">すべて</option>';
      NOTE_COLORS.forEach(c => {
        const o = document.createElement('option');
        o.value       = c.id;
        o.textContent = c.id;
        sel.appendChild(o);
      });
      sel.value = cur || 'all';
    }

    // ===== ノートグリッド描画 =====
    function renderNotes() {
      const grid = document.getElementById('notes-grid');
      const vis  = getVisible();

      if (!vis.length) {
        grid.innerHTML = `<div class="empty">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="4" y="6" width="24" height="22" rx="3" stroke="#555" stroke-width="2"/>
            <line x1="9" y1="13" x2="23" y2="13" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="9" y1="17" x2="23" y2="17" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
            <line x1="9" y1="21" x2="17" y2="21" stroke="#555" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          <p>${tasks.length === 0 ? '「＋」でノートを追加しよう' : '一致するノートがありません'}</p>
        </div>`;
        return;
      }

      grid.innerHTML = '';
      vis.forEach(task => {
        const color = getColor(task.category);
        const st    = dateStatus(task.dueDate);

        const card = document.createElement('div');
        card.className = `note-card nc-${color.id}`
          + (task.completed ? ' completed' : '')
          + (st === 'overdue' && !task.completed ? ' overdue' : '');
        card.style.background = color.bg;

        const okBtn = document.createElement('button');
        okBtn.className   = 'ok-btn';
        okBtn.title       = task.completed ? '未完了に戻す' : '完了にする';
        okBtn.textContent = task.completed ? '↩' : '✓';
        okBtn.addEventListener('click', e => { e.stopPropagation(); toggleComplete(task.id); });

        const delBtn = document.createElement('button');
        delBtn.className   = 'del-btn';
        delBtn.title       = '削除';
        delBtn.textContent = '✕';
        delBtn.addEventListener('click', e => { e.stopPropagation(); confirmDelete(task.id, task.title); });

        const titleEl = document.createElement('div');
        titleEl.className   = 'note-title';
        titleEl.textContent = task.title;

        card.appendChild(okBtn);
        card.appendChild(delBtn);
        card.appendChild(titleEl);

        if (task.dueDate) {
          const dueEl = document.createElement('div');
          dueEl.className   = `note-due ${st}`;
          dueEl.textContent = (st === 'overdue' ? '⚠ ' : st === 'today' ? '今日 ' : '') + fmtDate(task.dueDate);
          card.appendChild(dueEl);
        }

        card.addEventListener('click', () => openEdit(task.id));
        grid.appendChild(card);
      });
    }

    function render() { renderCatFilter(); renderNotes(); }

    // ===== 色選択UI =====
    function renderColorPick(selectedId) {
      const wrap = document.getElementById('color-pick');
      wrap.innerHTML = '';
      NOTE_COLORS.forEach(c => {
        const btn = document.createElement('button');
        btn.type             = 'button';
        btn.className        = 'color-opt' + (c.id === selectedId ? ' sel' : '');
        btn.style.background = c.bg;
        btn.title            = c.id;
        btn.dataset.cid      = c.id;
        btn.addEventListener('click', () => {
          wrap.querySelectorAll('.color-opt').forEach(b => b.classList.remove('sel'));
          btn.classList.add('sel');
        });
        wrap.appendChild(btn);
      });
    }

    function getSelectedColor() {
      const sel = document.querySelector('#color-pick .color-opt.sel');
      return sel ? sel.dataset.cid : NOTE_COLORS[0].id;
    }

    // ===== モーダル開閉 =====
    function openAdd() {
      editingId = null;
      document.getElementById('modal-title').textContent = '新規ノート';
      document.getElementById('f-title').value = '';
      document.getElementById('f-due').value   = '';
      document.getElementById('f-memo').value  = '';
      renderColorPick(NOTE_COLORS[0].id);
      document.getElementById('task-modal').classList.add('open');
      setTimeout(() => document.getElementById('f-title').focus(), 80);
    }

    function openEdit(id) {
      const t = tasks.find(t => t.id === id);
      if (!t) return;
      editingId = id;
      document.getElementById('modal-title').textContent = 'ノートを編集';
      document.getElementById('f-title').value = t.title;
      document.getElementById('f-due').value   = t.dueDate || '';
      document.getElementById('f-memo').value  = t.memo    || '';
      renderColorPick(t.category);
      document.getElementById('task-modal').classList.add('open');
    }

    function closeModal() {
      document.getElementById('task-modal').classList.remove('open');
    }

    // ===== 保存 =====
    function saveTask() {
      const title = document.getElementById('f-title').value.trim();
      if (!title) {
        showToast('タイトルを入力してください');
        document.getElementById('f-title').focus();
        return;
      }
      const data = {
        title,
        category: getSelectedColor(),
        dueDate:  document.getElementById('f-due').value,
        memo:     document.getElementById('f-memo').value.trim(),
      };
      if (editingId) {
        const i = tasks.findIndex(t => t.id === editingId);
        tasks[i] = { ...tasks[i], ...data };
        showToast('更新しました');
      } else {
        tasks.unshift({ ...data, id: Date.now().toString(), createdAt: Date.now(), completed: false });
        showToast('追加しました ✅');
      }
      saveData(); closeModal(); render();
    }

    // ===== 完了・削除 =====
    function toggleComplete(id) {
      const t = tasks.find(t => t.id === id);
      if (!t) return;
      t.completed = !t.completed;
      saveData(); render();
      showToast(t.completed ? '完了！ 🎉' : '未完了に戻しました');
    }

    function confirmDelete(id, title) {
      deletingId = id;
      document.getElementById('confirm-msg').textContent = `「${title}」を削除します。`;
      document.getElementById('confirm-modal').classList.add('open');
    }

    function execDelete() {
      tasks = tasks.filter(t => t.id !== deletingId);
      saveData(); render();
      document.getElementById('confirm-modal').classList.remove('open');
      showToast('削除しました');
    }

    // ===== トースト =====
    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      if (toastTimer) clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2000);
    }

    // ===== ヘッダー日付 =====
    function setDate() {
      const d = new Date(), days = ['日','月','火','水','木','金','土'];
      document.getElementById('header-date').textContent =
        `${d.getMonth()+1}/${d.getDate()}（${days[d.getDay()]}）`;
    }

    // ===== ウィンドウサイズ記憶 =====
    function initWindowSize() {
      try {
        const s = JSON.parse(localStorage.getItem('todo-window-size'));
        if (s) window.resizeTo(s.w, s.h);
      } catch(e) {}
      let t;
      window.addEventListener('resize', () => {
        clearTimeout(t);
        t = setTimeout(() => {
          try {
            localStorage.setItem('todo-window-size',
              JSON.stringify({ w: window.outerWidth, h: window.outerHeight }));
          } catch(e) {}
        }, 400);
      });
    }

    // ===== イベント登録 =====
    function bindEvents() {
      document.getElementById('btn-add').addEventListener('click', openAdd);
      document.getElementById('modal-close').addEventListener('click', closeModal);
      document.getElementById('modal-cancel').addEventListener('click', closeModal);
      document.getElementById('modal-save').addEventListener('click', saveTask);
      document.getElementById('confirm-cancel').addEventListener('click', () =>
        document.getElementById('confirm-modal').classList.remove('open'));
      document.getElementById('confirm-ok').addEventListener('click', execDelete);

      document.getElementById('cat-filter').addEventListener('change', e => {
        activeFilter = e.target.value; renderNotes();
      });
      document.getElementById('search-input').addEventListener('input', e => {
        searchText = e.target.value; renderNotes();
      });

      ['task-modal', 'confirm-modal'].forEach(id => {
        document.getElementById(id).addEventListener('click', e => {
          if (e.target === document.getElementById(id))
            document.getElementById(id).classList.remove('open');
        });
      });

      document.addEventListener('keydown', e => {
        if (e.ctrlKey && e.key === 'n') { e.preventDefault(); openAdd(); }
        if (e.key === 'Escape') {
          closeModal();
          document.getElementById('confirm-modal').classList.remove('open');
        }
        if (e.key === 'Enter' &&
            document.getElementById('task-modal').classList.contains('open') &&
            document.activeElement === document.getElementById('f-title'))
          saveTask();
      });
    }

    // ===== 初期化 =====
    function init() { loadData(); setDate(); bindEvents(); render(); initWindowSize(); }
    init();
  </script>
</body>
</html>
