<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>オシキング — ボタン1つのパーティ大会</title>
<!--
  オシキング：ホストPCをスクリーン投影し、各自スマホをコントローラーにする大人数パーティゲーム。
  1ファイルで2役：パラメータ無し→ホスト画面 ／ ?room=<peerId>→コントローラー画面。
  通信：PeerJS（無料公開クラウドでP2P）。QR：qrcode-generator（端末内生成）。
  ※テスト機能：ミニゲーム選択式・終了後☆1〜3評価（localStorage保存・一覧で可視化）。
  ※CPUもプレイヤーと同じ入力経路（ボタンを押す＝pressHandler）で動く。
  ※得点は 1位3点 / 2位2点 / 3位1点。
-->
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<style>
  :root{
    --ink:#16121f; --paper:#fef6e4; --hot:#ff3b6b; --cool:#3bc9ff;
    --gold:#ffcf3b; --lime:#9bff5b; --shadow:#0a0710;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
    background:var(--ink); color:var(--paper);
    min-height:100vh; -webkit-user-select:none; user-select:none; touch-action:manipulation;
  }
  .hidden{display:none !important;}
  button{font-family:inherit;}

  /* ============ ホスト画面 ============ */
  #hostView{min-height:100vh; display:flex; flex-direction:column;}
  .hud{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 22px; font-weight:800; letter-spacing:.04em; background:rgba(0,0,0,.25);
  }
  .hud .logo{font-size:22px; color:var(--gold);}
  .hud .round{font-size:14px; opacity:.7;}
  .stage{
    flex:1; position:relative; display:flex; align-items:center; justify-content:center;
    padding:12px 24px; background:radial-gradient(circle at 50% 30%, #2a1f3d, #120d1c 70%); overflow:auto;
  }
  .big-title{font-size:clamp(30px,6vw,60px); font-weight:900; text-align:center; line-height:1.15;}
  .sub{font-size:clamp(14px,2vw,18px); opacity:.75; margin-top:10px; text-align:center;}
  .rule-chip{
    display:inline-block; background:var(--hot); color:#fff; font-weight:800;
    padding:8px 20px; border-radius:99px; font-size:clamp(15px,2.2vw,20px); margin-top:16px;
  }
  /* ロビー */
  .lobby{display:flex; gap:clamp(20px,5vw,60px); align-items:center; flex-wrap:wrap; justify-content:center;}
  .qrbox{background:#fff; padding:16px; border-radius:18px; width:clamp(200px,30vw,300px); display:flex; align-items:center; justify-content:center;}
  .qrbox img{width:100%; height:auto; image-rendering:pixelated;}
  .qrfallback{color:#16121f; font-weight:800; text-align:center; font-size:14px; padding:20px;}
  .joininfo{max-width:420px;}
  .joininfo h2{font-size:clamp(22px,3.5vw,34px); font-weight:900; margin-bottom:8px;}
  .joininfo .url{background:rgba(255,255,255,.1); border-radius:10px; padding:8px 12px; margin-top:10px; font-size:12px; word-break:break-all; opacity:.85;}
  .roomcode{font-size:14px; opacity:.6; margin-top:6px;}
  .playerchips{display:flex; flex-wrap:wrap; gap:8px; margin-top:18px;}
  .pchip{display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.08); border-radius:99px; padding:6px 14px; font-weight:800; font-size:15px; animation:popin .3s;}
  @keyframes popin{from{transform:scale(.4); opacity:0;} to{transform:scale(1); opacity:1;}}
  .pchip .sw{width:14px; height:14px; border-radius:50%;}
  .lobby-actions{margin-top:22px; display:flex; gap:12px; flex-wrap:wrap; align-items:center; justify-content:center;}
  .startbtn{background:var(--gold); color:#1a1a1a; border:none; font-weight:900; font-size:18px; padding:15px 38px; border-radius:99px; cursor:pointer; box-shadow:0 5px 0 #c79a17;}
  .startbtn:active{transform:translateY(3px); box-shadow:0 2px 0 #c79a17;}
  .startbtn:disabled{opacity:.4; cursor:default; box-shadow:0 2px 0 #777;}
  .ghostbtn{background:rgba(255,255,255,.1); color:var(--paper); border:1px solid rgba(255,255,255,.25); font-weight:800; font-size:14px; padding:13px 20px; border-radius:99px; cursor:pointer;}

  /* テストメニュー */
  .menu-wrap{display:flex; flex-direction:column; align-items:center; gap:14px; width:100%;}
  .menu-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; width:min(900px,94%);}
  .gcard{background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); border-radius:16px; padding:16px 14px; cursor:pointer; color:var(--paper); text-align:center; transition:transform .12s, background .12s;}
  .gcard:hover{transform:translateY(-3px); background:rgba(255,255,255,.16);}
  .gcard .gt{font-weight:900; font-size:18px;}
  .gcard .gs{color:var(--gold); font-size:18px; margin:4px 0; letter-spacing:2px;}
  .gcard .gd{font-size:12px; opacity:.7; line-height:1.4;}

  /* アリーナ */
  .arena{position:absolute; inset:0;}
  .dot{position:absolute; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:900; color:#1a1a1a; transition:transform .12s ease, opacity .3s; box-shadow:0 4px 0 rgba(0,0,0,.3); text-align:center; line-height:1.05; overflow:hidden;}
  .dot.dead{opacity:.18; filter:grayscale(1);}
  .countdown{font-size:clamp(60px,16vw,150px); font-weight:900; color:var(--gold); z-index:5;}
  .winner{font-size:clamp(34px,8vw,72px); font-weight:900; color:var(--gold);}
  /* 結果（3・2・1） */
  .result-top{display:flex; flex-direction:column; gap:8px; margin:16px 0;}
  .rwin{font-size:clamp(24px,5vw,44px); font-weight:900;}
  .rwin small{font-size:.5em; color:var(--lime);}
  .rate-wrap{margin-top:18px;}
  .rate-row{display:flex; gap:8px; justify-content:center; align-items:center; margin-top:8px; flex-wrap:wrap;}
  .star-btn{font-size:34px; background:none; border:none; cursor:pointer; color:#888; line-height:1;}
  .star-btn.on{color:var(--gold);}
  /* ゲームごとの結果（だれが何をしたか） */
  .result-detail{margin:14px auto 4px; max-width:min(540px,92%);}
  .detail-title{font-size:14px; opacity:.8; font-weight:800; margin:10px 0 6px;}
  .detail-list{display:flex; flex-direction:column; gap:5px;}
  .drow{display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.07); border-radius:10px; padding:7px 12px; font-weight:800; font-size:15px;}
  .drow.dead{opacity:.42;}
  .drow .dsw{width:14px; height:14px; border-radius:50%; flex:none;}
  .drow .dnm{flex:1; text-align:left;}
  .drow .dval{color:var(--lime); font-weight:900; text-align:right; white-space:nowrap;}
  /* 結果バー（ジャストのド真ん中バー再現） */
  .result-bar-wrap{margin:22px auto 4px; max-width:min(540px,92%);}
  .result-bar{position:relative; height:30px; border-radius:99px; background:rgba(255,255,255,.1); margin-top:20px;}
  .result-bar .rb-center{position:absolute; left:50%; top:-8px; bottom:-8px; width:3px; background:#fff; transform:translateX(-50%);}
  .result-bar .rb-mark{position:absolute; top:50%; width:15px; height:15px; border-radius:50%; transform:translate(-50%,-50%); box-shadow:0 0 0 2px rgba(0,0,0,.45);}
  .result-bar .rb-label{position:absolute; top:-24px; font-size:11px; font-weight:900; transform:translateX(-50%); white-space:nowrap;}
  /* 連打のライブカウントバッジ */
  .mash-badge{position:absolute; right:-3px; top:-3px; min-width:20px; height:20px; padding:0 4px; border-radius:99px; background:#fff; color:#1a1a1a; font-size:11px; font-weight:900; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 0 rgba(0,0,0,.3); z-index:2;}
  /* 演出（紙吹雪・画面フラッシュ） */
  .fx-confetti{position:fixed; inset:0; pointer-events:none; z-index:90; overflow:hidden;}
  .fx-confetti span{position:absolute; top:-8%; will-change:transform; animation:confFall 2s linear forwards;}
  @keyframes confFall{ to{ transform:translateY(116vh) rotate(560deg); opacity:.15; } }
  .fx-flash{position:fixed; inset:0; background:rgba(255,255,255,.5); pointer-events:none; z-index:89; animation:flashOut .42s ease-out forwards;}
  @keyframes flashOut{ from{opacity:.75;} to{opacity:0;} }
  .winner{animation:winPop .5s cubic-bezier(.2,1.4,.4,1);}
  @keyframes winPop{ from{transform:scale(.3); opacity:0;} to{transform:scale(1); opacity:1;} }
  /* スコアボード */
  .board{padding:10px 26px 20px; max-height:34vh; overflow:auto; background:rgba(0,0,0,.2);}
  .scrow{display:flex; align-items:center; gap:12px; padding:6px 0; font-weight:800; font-size:clamp(15px,2vw,20px);}
  .scrow .rk{width:30px; text-align:center; color:var(--gold); font-weight:900;}
  .scrow .nm{flex:1;}
  .scrow .pt{color:var(--lime); font-weight:900;}
  .scrow .swatch{width:18px; height:18px; border-radius:50%;}

  /* 親機プレイ（デバッグ用：ホストPCでも遊ぶ） */
  .host-play-btn{position:fixed; right:18px; bottom:18px; z-index:50; background:radial-gradient(circle at 35% 30%, #ff6b8f, var(--hot)); color:#fff; border:none; border-radius:18px; padding:14px 18px; font-weight:900; font-size:15px; line-height:1.25; text-align:center; cursor:pointer; box-shadow:0 6px 0 #b81f47, 0 8px 20px rgba(255,59,107,.4);}
  .host-play-btn:active{transform:translateY(4px); box-shadow:0 2px 0 #b81f47;}
  .host-play-btn small{display:block; font-size:11px; opacity:.85; font-weight:700;}

  /* ============ コントローラー画面（スマホ） ============ */
  #ctrlView{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:space-between; padding:28px 20px calc(28px + env(safe-area-inset-bottom)); background:#0d0a14;}
  .ctrl-top{text-align:center; width:100%;}
  .ctrl-top .label{font-size:13px; opacity:.55; font-weight:700;}
  .ctrl-top .me{font-weight:900; font-size:22px; margin-top:4px;}
  .name-screen{display:flex; flex-direction:column; gap:16px; align-items:center; width:100%; max-width:340px; margin:auto;}
  .name-screen h2{font-size:22px; font-weight:900; text-align:center;}
  .name-input{width:100%; font-size:20px; padding:14px 16px; border-radius:14px; border:2px solid var(--gold); background:#fff; color:#16121f; text-align:center; font-family:inherit;}
  .joinbtn{background:var(--gold); color:#1a1a1a; border:none; font-weight:900; font-size:20px; padding:16px 40px; border-radius:99px; cursor:pointer; box-shadow:0 5px 0 #c79a17;}
  .joinbtn:active{transform:translateY(3px); box-shadow:0 2px 0 #c79a17;}
  .tapbtn{width:min(74vw,300px); aspect-ratio:1; border-radius:50%; border:none; cursor:pointer; background:radial-gradient(circle at 35% 30%, #ff6b8f, var(--hot)); color:#fff; font-size:clamp(28px,9vw,44px); font-weight:900; letter-spacing:.05em; box-shadow:0 12px 0 #b81f47, 0 16px 34px rgba(255,59,107,.4); transition:transform .05s, box-shadow .05s;}
  .tapbtn:active{transform:translateY(10px); box-shadow:0 2px 0 #b81f47;}
  .tapbtn:disabled{opacity:.3; cursor:default; box-shadow:0 4px 0 #555;}
  .phone-status{font-size:18px; font-weight:800; min-height:26px; text-align:center; padding:0 10px; white-space:pre-line;}
  .conn-banner{font-size:14px; font-weight:700; opacity:.7; min-height:20px; text-align:center;}
</style>
</head>
<body>

<!-- ============ ホスト画面 ============ -->
<div id="hostView" class="hidden">
  <div class="hud">
    <span class="logo">★ オシキング</span>
    <span class="round" id="roundLabel"></span>
  </div>
  <div class="stage" id="stage"></div>
  <div class="board hidden" id="board"></div>
  <button id="hostPlayBtn" class="host-play-btn hidden">あなたが押す<small>SPACE / クリック</small></button>
</div>

<!-- ============ コントローラー画面 ============ -->
<div id="ctrlView" class="hidden">
  <div class="ctrl-top">
    <div class="label">あなたのコントローラー</div>
    <div class="me" id="ctrlName">　</div>
  </div>
  <div class="name-screen" id="nameScreen">
    <h2>なまえを入れて<br>参加しよう！</h2>
    <input class="name-input" id="nameInput" maxlength="8" placeholder="なまえ（8文字まで）">
    <button class="joinbtn" id="joinBtn">参加する</button>
    <div class="conn-banner" id="connBanner">ホストに接続中…</div>
  </div>
  <div class="hidden" id="playScreen" style="display:flex; flex-direction:column; align-items:center; gap:22px; flex:1; justify-content:center; width:100%;">
    <div class="phone-status" id="phoneStatus">スタート待ち…</div>
    <button class="tapbtn" id="tap" disabled>OSU!</button>
  </div>
  <div class="conn-banner" id="connBanner2"></div>
</div>

<script>
"use strict";

// ===== 共通設定 =====
const COLORS=["#ff3b6b","#3bc9ff","#ffcf3b","#9bff5b","#c77bff","#ff944d","#4dffd0","#ff6b9b",
              "#7bd0ff","#ffd84d","#b6ff6b","#ff7bd0","#6bffe0","#ffa06b","#9b8bff","#ff5b8b"];
// ミニゲーム定義（ui: tap=1ボタン / cycle=押すたび手が変わる）
const GAMES=[
  {key:"fast",    title:"最速おし",   rule:"GO！が出たら一番早く押せ", ui:"tap"},
  {key:"slow",    title:"がまん",     rule:"ニセ合図に釣られるな！本物の解除で押せ", ui:"tap"},
  {key:"just",    title:"ジャスト",   rule:"ゲージがド真ん中で押せ",  ui:"tap"},
  {key:"sank",    title:"3すくみ",    rule:"押すたび グー→チョキ→パー", ui:"cycle"},
  {key:"mash",    title:"連打耐久",   rule:"5秒間で一番多く押せ",     ui:"tap"},
  {key:"chicken", title:"チキンレース", rule:"最後から2・3・4番目が勝ち！ドベと未押下はダメ", ui:"tap"},
  {key:"daruma",  title:"だるまさんがころんだ", rule:"進めの間だけ連打！止まれで押すと後退", ui:"tap"},
  {key:"minority", title:"少数決",     rule:"少ない方が生き残る。多数派は道連れ", ui:"cycle"},
  {key:"maruta",  title:"丸太ジャンプ", rule:"丸太が来た瞬間にジャンプ！早すぎ遅すぎNG", ui:"tap"},
  {key:"san3",    title:"3の倍数で押すな", rule:"数字でリズム押し。3の倍数と3の付く数は押すな", ui:"tap"},
  {key:"gunman",  title:"早撃ちガンマン", rule:"標的に選ばれてなければ早押し！標的が押すと負け", ui:"tap"},
  {key:"clock",   title:"秒数当て",   rule:"指定の秒ピッタリで押せ。途中で時計は消える", ui:"tap"},
  {key:"evenodd", title:"偶奇投票",   rule:"A/B/Cに投票。人数が指定の偶/奇のグループが生存", ui:"cycle"},
  {key:"odai",    title:"お題早押し", rule:"お題に合うものが出たら早押し！違うのは押すな", ui:"tap"},
  {key:"repeat",  title:"最速◯回",   rule:"規定回数を最速連打！ロック中に押すとリセット", ui:"tap"},
  {key:"fruit",   title:"果物カウント", rule:"次々出る果物を数えて、押した回数で答える", ui:"counter"},
];

const PARAMS=new URLSearchParams(location.search);
const ROOM=PARAMS.get("room");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const $=id=>document.getElementById(id);

// localStorage（プライベートモード対策でtry-catch）
function saveData(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }
function loadData(k,d){ try{const i=localStorage.getItem(k); return i?JSON.parse(i):d;}catch(e){return d;} }
function shuffle(a){ a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }

/* ===== サウンド＆演出（Web Audio・ファイル不要・オフライン動作） ===== */
let _actx=null, _lastLose=0;
function sfxInit(){ // ユーザー操作のタイミングで呼ぶ（自動再生ポリシー対策）
  try{ if(!_actx){ const AC=window.AudioContext||window.webkitAudioContext; if(AC) _actx=new AC(); }
       if(_actx && _actx.state==="suspended") _actx.resume(); }catch(e){}
}
function tone(freq,dur,type,vol,when){
  if(!_actx) return;
  const t=_actx.currentTime+(when||0);
  const o=_actx.createOscillator(), g=_actx.createGain();
  o.type=type||"square"; o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(_actx.destination); o.start(t); o.stop(t+dur+0.03);
}
function sfx(name){
  if(!_actx) return;
  switch(name){
    case "press":   tone(660,0.05,"square",0.10); break;
    case "count":   tone(440,0.12,"sine",0.18); break;
    case "go":      tone(880,0.16,"square",0.20); tone(1320,0.16,"square",0.10,0.02); break;
    case "good":    tone(740,0.10,"triangle",0.18); tone(988,0.12,"triangle",0.14,0.08); break;
    case "lose":    { const n=performance.now(); if(n-_lastLose<110) return; _lastLose=n; tone(220,0.26,"sawtooth",0.16); tone(160,0.30,"sawtooth",0.13,0.05); } break;
    case "win":     [523,659,784,1047].forEach((f,i)=>tone(f,0.16,"triangle",0.20,i*0.09)); break;
    case "fanfare": [523,659,784,1047,880,1047,1319].forEach((f,i)=>tone(f,0.20,"square",0.17,i*0.11)); break;
  }
}
function partyBurst(){
  const layer=document.createElement("div"); layer.className="fx-confetti";
  const E=["🎉","✨","🎊","⭐","💥","🏆","🎈"];
  for(let i=0;i<26;i++){ const s=document.createElement("span"); s.textContent=E[i%E.length];
    s.style.left=(Math.random()*100)+"%"; s.style.fontSize=(16+Math.random()*24)+"px";
    s.style.animationDelay=(Math.random()*0.35)+"s"; s.style.animationDuration=(1.6+Math.random()*0.9)+"s";
    layer.appendChild(s); }
  document.body.appendChild(layer); setTimeout(()=>layer.remove(),2600);
}
function screenFlash(color){ const f=document.createElement("div"); f.className="fx-flash"; if(color) f.style.background=color; document.body.appendChild(f); setTimeout(()=>f.remove(),420); }

/* ============================================================
   ホスト側
   ============================================================ */
let players=[];        // {id,name,color,cpu,conn,alive}
let scores={};
let round=0;
let nextId=0;
let started=false;
let running=false;
let hostPlayerId=null;            // 親機（ホストPC）で遊ぶプレイヤーのID（デバッグ用・SPACE/クリックで押す）
let resultDetail="";              // 各ゲームが設定する「だれが何をしたか」の結果HTML（showResultが表示）
let pressHandler=null;            // 各ゲームが設定。コントローラー/CPU/親機の press を受ける
let cpuTimers=[], cpuIntervals=[];
let ratings=loadData("oshiking-ratings", {}); // {gameKey: stars(1-3)}

function ct(fn,delay){ const t=setTimeout(fn,delay); cpuTimers.push(t); return t; }
function clearCpu(){ cpuTimers.forEach(clearTimeout); cpuTimers=[]; cpuIntervals.forEach(clearInterval); cpuIntervals=[]; }
function endInputs(){ pressHandler=null; clearCpu(); broadcast({type:"enable", on:false}); }

function host_init(){
  $("hostView").classList.remove("hidden");
  $("roundLabel").textContent="参加者をあつめよう";
  showLobby("ルームを準備中…", null);
  if(typeof Peer==="undefined"){ showLobby("通信ライブラリの読み込み失敗", "ネット接続を確認して再読み込み"); return; }
  const peer=new Peer(); window._peer=peer;
  peer.on("open", id=>{ showLobby(location.origin+location.pathname+"?room="+id, id); });
  peer.on("error", e=>{ console.warn("peer error",e); $("roundLabel").textContent="通信エラー："+(e&&e.type?e.type:""); });
  peer.on("connection", conn=>{
    conn.on("data", msg=>handleHostMessage(conn,msg));
    conn.on("close", ()=>{});
  });
  // 親機プレイ（デバッグ）：SPACE/Enter または画面右下ボタンで押す
  window.addEventListener("keydown", e=>{
    if((e.code==="Space"||e.code==="Enter") && hostPlayerId!=null && pressHandler){ e.preventDefault(); hostPress(); }
  });
  const hb=$("hostPlayBtn");
  if(hb) hb.addEventListener("pointerdown", e=>{ e.preventDefault(); hostPress(); });
}

function handleHostMessage(conn,msg){
  if(!msg||!msg.type) return;
  if(msg.type==="join"){
    let p=players.find(x=>x.conn===conn);
    if(!p){
      p={id:nextId++, name:(msg.name||("P"+nextId)).slice(0,8), color:COLORS[(nextId-1)%COLORS.length], cpu:false, conn:conn, alive:true};
      players.push(p); scores[p.id]=0;
    }else{ p.name=(msg.name||p.name).slice(0,8); }
    sendTo(p,{type:"welcome", color:p.color, name:p.name});
    if(!started) renderLobbyPlayers();
    return;
  }
  if(msg.type==="press"){
    const p=players.find(x=>x.conn===conn);
    if(p && pressHandler) pressHandler(p.id, msg.t);
  }
}
function sendTo(p,msg){ if(p.conn && p.conn.open){ try{p.conn.send(msg);}catch(e){} } }
function sendToId(id,msg){ const p=players.find(x=>x.id===id); if(p) sendTo(p,msg); }
function broadcast(msg){ players.forEach(p=>{ if(!p.cpu) sendTo(p,msg); }); }

async function runSingle(key){

async function runTournament(){

async function playGame(game){
  players.forEach(p=>p.alive=true);

  resultDetail="";
  if(game.key==="fast")    return await gameFast();
  if(game.key==="slow")    return await gameSlow();
  if(game.key==="just")    return await gameJust();
  if(game.key==="sank")    return await gameSankume();
  if(game.key==="mash")    return await gameMash();
  if(game.key==="chicken") return await gameChicken();
  if(game.key==="daruma")  return await gameDaruma();
  if(game.key==="minority") return await gameMinority();
  if(game.key==="maruta")  return await gameMaruta();
  if(game.key==="san3")    return await gameSan3();
  if(game.key==="gunman")  return await gameGunman();
  if(game.key==="clock")   return await gameClock();
  if(game.key==="evenodd") return await gameEvenOdd();
  if(game.key==="odai")    return await gameOdai();
  if(game.key==="repeat")  return await gameRepeat();

  return [];

// 最速おし
async function gameFast(){
  renderArena(); const cd=addCountdown("…");
  broadcast({type:"prompt", text:"まだ！", ui:"tap", enable:true});
  const times={}; let go=false;
  pressHandler=(id)=>{
    if(times[id]==="foul") return;
    if(!go){ times[id]="foul"; flash(id,true); sendToId(id,{type:"prompt",text:"フライング！",enable:false}); }
    else if(times[id]===undefined){ times[id]=performance.now(); flash(id); }
  };
  await sleep(1200+Math.random()*2200);
  go=true; const goAt=performance.now(); cd.textContent="GO！"; cd.style.color="var(--lime)"; sfx("go");
  broadcast({type:"prompt", text:"今だ！押せ！", enable:true});
  players.forEach(p=>{ if(p.cpu) ct(()=>{ if(pressHandler) pressHandler(p.id); }, 130+Math.random()*460); });
  await sleep(1000);
  endInputs();
  const ranking=Object.entries(times).filter(([id,t])=>typeof t==="number").sort((a,b)=>a[1]-b[1]).map(([id])=>+id);
  const rows=ranking.map(id=>({id, val:Math.round(times[id]-goAt)+"ms ⚡"}));
  players.forEach(p=>{ if(times[p.id]==="foul") rows.push({id:p.id, val:"フライング", dead:true}); else if(times[p.id]===undefined) rows.push({id:p.id, val:"押さず", dead:true}); });
  resultDetail='<div class="detail-title">反応タイム（GOから・速い順）</div>'+detailRows(rows);
  return ranking;
}

// がまん（ひっかけ）：ニセの「押せ！」に釣られるな。本物の「解除！」で一番早く押した人が勝ち。
async function gameSlow(){
  renderArena();
  const cd=addCountdown("…");
  broadcast({type:"prompt", text:"押すな…耐えろ\nニセの合図に釣られるな", ui:"tap", enable:true});
  let phase="hold"; let goAt=0;
  const aliveSet=new Set(players.map(p=>p.id));
  const elim=[];        // 釣られて脱落した順
  const reacted={};     // 解除後に押した時刻(ms)
  pressHandler=(id)=>{
    if(phase==="hold"){
      if(aliveSet.has(id)){ aliveSet.delete(id); elim.push(id); flash(id,true); sendToId(id,{type:"prompt",text:"釣られた！脱落",enable:false}); }
    }else{
      if(aliveSet.has(id) && reacted[id]===undefined){ reacted[id]=performance.now()-goAt; flash(id); sendToId(id,{type:"prompt",text:"反応OK！",enable:false}); }
    }
  };
  const holdDur=4000+Math.random()*2500, traps=2+Math.floor(Math.random()*2);
  function fakeSignal(){
    if(phase!=="hold") return;
    cd.textContent="いま押せ！？"; cd.style.color="var(--hot)";
    broadcast({type:"prompt", text:"いま押せ！？（ニセかも…）", enable:true});
    players.forEach(p=>{ if(p.cpu && aliveSet.has(p.id) && Math.random()<0.22) ct(()=>{ if(pressHandler&&phase==="hold") pressHandler(p.id); }, 80+Math.random()*250); });
    setTimeout(()=>{ if(phase==="hold"){ cd.textContent="…まだ…"; cd.style.color="var(--gold)"; broadcast({type:"prompt", text:"…まだ！耐えろ…", enable:true}); } }, 550);
  }
  for(let k=0;k<traps;k++){ ct(fakeSignal, 700+(k+1)*(holdDur/(traps+1))); }
  const t0=performance.now();
  while(performance.now()-t0<holdDur && aliveSet.size>0){ await sleep(120); }
  phase="go"; goAt=performance.now(); cd.textContent="解除！押せ！"; cd.style.color="var(--lime)";
  broadcast({type:"prompt", text:"解除！今だ押せ！", enable:true});
  players.forEach(p=>{ if(p.cpu && aliveSet.has(p.id)) ct(()=>{ if(pressHandler) pressHandler(p.id); }, 150+Math.random()*500); });
  await sleep(1300);
  endInputs();
  const reactedIds=Object.keys(reacted).map(Number).sort((a,b)=>reacted[a]-reacted[b]);
  const noReact=[...aliveSet].filter(id=>reacted[id]===undefined);
  const elimRev=[...elim].reverse(); // 遅く釣られた＝よく耐えた人ほど上位
  const ranking=[...reactedIds, ...noReact, ...elimRev];
  const rows=[];
  reactedIds.forEach(id=>rows.push({id, val:Math.round(reacted[id])+"ms ⚡"}));
  noReact.forEach(id=>rows.push({id, val:"無反応"}));
  elimRev.forEach(id=>rows.push({id, val:"釣られた✗", dead:true}));
  resultDetail='<div class="detail-title">本物の「解除」への反応（ニセに釣られた人は脱落）</div>'+detailRows(rows);
  return ranking;
}

// 3すくみ
async function gameSankume(){
  renderArena();
  const arenaEl=$("stage").querySelector(".arena");
  const HL=["✊グー","✌チョキ","✋パー"];
  // 本物のじゃんけんルール：手が2種類だけ出ていれば勝つ方の手が勝ち。1種類or3種類全部出ていれば「あいこ」＝もう一回。
  let hands={}, best=null, attempt=0;
  const MAXTRY=4;
  while(best===null && attempt<MAXTRY){
    attempt++;
    if(arenaEl) arenaEl.querySelectorAll(".countdown").forEach(el=>el.remove());
    hands={}; players.forEach(p=>hands[p.id]=0);
    broadcast({type:"prompt", text: attempt===1?"押すたび グー→チョキ→パー":"あいこでしょ！\nもう一回", ui:"cycle", options:HL, enable:true});
    pressHandler=(id)=>{ hands[id]=((hands[id]||0)+1)%3; flash(id); };
    players.forEach(p=>{ if(p.cpu){ const taps=Math.floor(Math.random()*4); for(let k=0;k<taps;k++) ct(()=>{ if(pressHandler) pressHandler(p.id); }, 150+Math.random()*(attempt===1?2200:1100)); } });
    const cd=addCountdown(attempt===1?"3":"せーの");
    if(attempt===1){ for(let i=3;i>=1;i--){ cd.textContent=i; sfx("count"); await sleep(900); } }
    else{ sfx("count"); await sleep(1000); }
    cd.textContent="ドン！"; sfx("go"); endInputs();
    const counts=[0,0,0]; Object.values(hands).forEach(v=>counts[v]++);
    const present=[0,1,2].filter(h=>counts[h]>0);
    if(present.length===2){ const [a,b]=present; best = ((a+1)%3===b) ? a : b; } // aがbを倒すなら a が勝ち手
    if(best===null){ cd.textContent="あいこ！"; cd.style.color="var(--cool)"; await sleep(600); }
  }
  let ranking, headline;
  if(best===null){
    ranking=shuffle(players.map(p=>p.id));
    headline="あいこ続き…引き分け（全員おなじ点）";
  }else{
    const winners=players.filter(p=>hands[p.id]===best).map(p=>p.id);
    const losers=players.filter(p=>hands[p.id]!==best).map(p=>p.id);
    ranking=[...shuffle(winners), ...shuffle(losers)];
    headline="みんなの手（勝ち手＝"+HL[best]+"）";
  }
  await sleep(600);
  const rows=ranking.map(id=>({id, val:HL[hands[id]]+(hands[id]===best?" ◎勝ち":""), dead:best!==null&&hands[id]!==best}));
  resultDetail='<div class="detail-title">'+headline+'</div>'+detailRows(rows);
  return ranking;
}

// チキンレース：押した順で、最後から2・3・4番目が3・2・1点。ドベと未押下は負け。
async function gameChicken(){
  renderArena();
  const arena=$("stage").querySelector(".arena");
  const bar=document.createElement("div");
  bar.style.cssText="position:absolute;left:12%;right:12%;bottom:14%;height:22px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden";
  const fill=document.createElement("div"); fill.style.cssText="position:absolute;left:0;top:0;height:100%;width:0;background:linear-gradient(90deg,var(--lime),var(--hot))";
  bar.appendChild(fill); arena.appendChild(bar);
  const note=document.createElement("div");
  note.style.cssText="position:absolute;left:0;right:0;bottom:24%;text-align:center;font-weight:900;font-size:clamp(15px,2.4vw,22px);color:var(--gold);";
  note.innerHTML="最後から<b>2・3・4番目</b>が勝ち！<br><span style='color:var(--hot)'>ドベ（最後）と未押下はダメ</span>";
  arena.appendChild(note);
  broadcast({type:"prompt", text:"ギリギリまで我慢！\nでもドベ（最後）はダメ！\n（誰がいつ降りたかは結果発表まで内緒）", ui:"tap", enable:true});
  const pressedAt={}; const order=[];
  // プレイ中は誰が押したか他の人に見えないようにする（flashしない・本人にだけ通知）
  pressHandler=(id)=>{ if(pressedAt[id]===undefined){ pressedAt[id]=performance.now(); order.push(id); sendToId(id,{type:"prompt",text:"降りた！（結果は発表までナイショ）",enable:false}); } };
  players.forEach(p=>{ if(p.cpu) ct(()=>{ if(pressHandler) pressHandler(p.id); }, 500+Math.random()*7000); });
  const DUR=8000, t0=performance.now();
  await new Promise(res=>{ (function loop(){ const e=performance.now()-t0; fill.style.width=Math.min(100,e/DUR*100)+"%"; if(e>=DUR) res(); else requestAnimationFrame(loop); })(); });
  endInputs();
  note.remove();
  const cdReveal=addCountdown("結果発表…"); cdReveal.style.top="8%"; cdReveal.style.fontSize="clamp(20px,3.2vw,32px)"; cdReveal.style.color="var(--gold)";
  await sleep(700);
  // ここで初めて、押した順を一人ずつ明かす演出
  for(const id of order){ flash(id); sfx("press"); await sleep(260); }
  players.forEach(p=>{ if(pressedAt[p.id]===undefined) flash(p.id, true); });
  await sleep(300);
  const n=order.length, ranking=[];
  if(n>=2) ranking.push(order[n-2]);  // 最後から2番目 = 1位(3点)
  if(n>=3) ranking.push(order[n-3]);  // 3番目 = 2位(2点)
  if(n>=4) ranking.push(order[n-4]);  // 4番目 = 3位(1点)
  if(n>=1){ const d=$("dot"+order[n-1]); if(d) d.classList.add("dead"); }
  players.forEach(p=>{ if(pressedAt[p.id]===undefined){ const d=$("dot"+p.id); if(d) d.classList.add("dead"); } });
  const rows=[];
  order.forEach((id,idx)=>{
    const fromLast=n-1-idx; let label;
    if(fromLast===0) label="ドベ（最後）✗";
    else if(fromLast===1) label="🥇最後から2番目 +3";
    else if(fromLast===2) label="🥈最後から3番目 +2";
    else if(fromLast===3) label="🥉最後から4番目 +1";
    else label=(idx+1)+"番目に降りた";
    rows.push({id, val:label, dead:(fromLast===0)});
  });
  players.forEach(p=>{ if(pressedAt[p.id]===undefined) rows.push({id:p.id, val:"最後まで押さず✗", dead:true}); });
  resultDetail='<div class="detail-title">降りた順（最後から2・3・4番目が勝ち／ドベ・未押下は負け）</div>'+detailRows(rows);
  return ranking;
}

// だるまさんがころんだ：「すすめ」中だけ連打で前進、「とまれ」中に押すと後退。ゴール到達順＝上位。
async function gameDaruma(){
  $("stage").innerHTML='<div class="arena"></div>';
  const arena=$("stage").querySelector(".arena");
  // 鬼（ゴール）
  const oni=document.createElement("div");
  oni.style.cssText="position:absolute;right:3%;top:50%;transform:translateY(-50%);font-size:clamp(40px,9vw,86px);";
  oni.textContent="🧸"; arena.appendChild(oni);
  const phaseEl=addCountdown("…"); phaseEl.style.top="13%";
  // プレイヤーごとに横レーンのコマを置く（flashが効くようid=dot+pid）
  const n=players.length, step=Math.min(13,58/Math.max(1,n));
  const size=Math.max(26,Math.min(44,360/Math.sqrt(n+1)));
  const lanes={};
  players.forEach((p,i)=>{
    const tok=document.createElement("div"); tok.className="dot"; tok.id="dot"+p.id;
    tok.style.width=size+"px"; tok.style.height=size+"px"; tok.style.fontSize=Math.max(10,size*0.26)+"px";
    tok.style.background=p.color; tok.textContent=p.name.slice(0,2);
    tok.style.left="5%"; tok.style.top=(24+i*step)+"%"; tok.style.transition="left .15s, transform .12s";
    arena.appendChild(tok); lanes[p.id]=tok;
  });
  const GOAL=100, prog={}; players.forEach(p=>prog[p.id]=0);
  const finished=[]; // ゴール到達順
  const place=id=>{ lanes[id].style.left=(5+Math.min(GOAL,prog[id])/GOAL*80)+"%"; };
  let phase="stop"; // go / stop
  pressHandler=(id)=>{
    if(finished.includes(id)) return;
    if(phase==="go"){ prog[id]+=4+Math.random()*2; flash(id); }
    else { prog[id]=Math.max(0,prog[id]-20); flash(id); const d=$("dot"+id); if(d){ d.style.transition="left .25s, transform .12s"; } sendToId(id,{type:"prompt",text:"動いた！大きく後退！",enable:true}); } // とまれの後退は強め（前進の約4倍）
    if(prog[id]>=GOAL){ finished.push(id); prog[id]=GOAL; lanes[id].style.boxShadow="0 0 0 4px var(--gold)"; sendToId(id,{type:"prompt",text:"ゴール！🎉",enable:false}); }
    place(id);
  };
  // CPU：すすめ中は高確率で連打、とまれ中はまれに誤反応（フライング）
  const cpuIv=setInterval(()=>{
    players.forEach(p=>{ if(!p.cpu||finished.includes(p.id)) return;
      if(phase==="go"){ if(Math.random()<0.7) pressHandler(p.id); }
      else if(Math.random()<0.05) pressHandler(p.id);
    });
  },220); cpuIntervals.push(cpuIv);
  const t0=performance.now(), DUR=18000;
  while(performance.now()-t0<DUR && finished.length<players.length){
    phase="stop"; phaseEl.textContent="…とまれ…"; phaseEl.style.color="var(--hot)";
    broadcast({type:"prompt", text:"とまれ！押すな", ui:"tap", enable:true});
    await sleep(700+Math.random()*1500);
    if(finished.length>=players.length) break;
    phase="go"; phaseEl.textContent="すすめ！"; phaseEl.style.color="var(--lime)";
    broadcast({type:"prompt", text:"すすめ！連打！", enable:true});
    await sleep(900+Math.random()*1400);
  }
  phaseEl.textContent="しゅうりょう！"; endInputs();
  // ゴール到達順 → 残りは進捗降順
  const rest=players.map(p=>p.id).filter(id=>!finished.includes(id)).sort((a,b)=>prog[b]-prog[a]);
  const ranking=[...finished, ...rest];
  const rows=ranking.map(id=>({id, val: finished.includes(id)?("ゴール！"+(finished.indexOf(id)+1)+"着 🏁"):("途中 "+Math.round(prog[id])+"%"), dead:!finished.includes(id)&&prog[id]<1}));
  resultDetail='<div class="detail-title">ゴール状況</div>'+detailRows(rows);
  return ranking;
}

// 少数決（道連れ）：2択で少数派が生き残り、多数派は道連れで脱落。脱落の逆順＝順位。
async function gameMinority(){
  renderArena();
  const arenaEl=$("stage").querySelector(".arena");
  const OPTIONS=["🔴 あか","🔵 あお"];
  let alive=players.map(p=>p.id); const elim=[];
  let roundNo=0; const roundLog=[]; // {r, c0, c1, winSide|null}
  while(alive.length>2 && roundNo<6){
    roundNo++;
    if(arenaEl) arenaEl.querySelectorAll(".countdown").forEach(el=>el.remove()); // 前ラウンドの表示を消してから
    const votes={}; alive.forEach(id=>votes[id]=0);
    broadcast({type:"prompt", text:"少ない方が生き残る！\n押して選ぶ", ui:"cycle", options:OPTIONS, enable:true});
    players.forEach(p=>{ if(alive.includes(p.id)) { const d=$("dot"+p.id); if(d) d.classList.remove("dead"); } });
    pressHandler=(id)=>{ if(!alive.includes(id)) return; votes[id]=((votes[id]||0)+1)%2; flash(id); };
    // CPU：ランダム回数トグル（最終選択がばらける）
    alive.forEach(id=>{ const p=players.find(x=>x.id===id); if(p&&p.cpu){ const taps=Math.floor(Math.random()*3); for(let k=0;k<taps;k++) ct(()=>{ if(pressHandler) pressHandler(id); }, 200+Math.random()*2200); } });
    const cd=addCountdown(roundNo>1?("第"+roundNo+"回"):"3"); await sleep(roundNo>1?700:0);
    for(let i=3;i>=1;i--){ cd.textContent=i; await sleep(900); }
    cd.textContent="オープン！"; endInputs();
    const c=[0,0]; alive.forEach(id=>c[votes[id]]++);
    await sleep(500);
    if(c[0]===c[1]){ roundLog.push({r:roundNo, c0:c[0], c1:c[1], winSide:null}); cd.textContent="同数！全員セーフ（🔴"+c[0]+" / 🔵"+c[1]+"）"; cd.style.color="var(--cool)"; await sleep(1300); continue; }
    const minoritySide=c[0]<c[1]?0:1;
    roundLog.push({r:roundNo, c0:c[0], c1:c[1], winSide:minoritySide});
    const survivors=alive.filter(id=>votes[id]===minoritySide);
    const losers=alive.filter(id=>votes[id]!==minoritySide);
    losers.forEach(id=>{ flash(id,true); elim.push(id); if(!players.find(p=>p.id===id).cpu) sendToId(id,{type:"prompt",text:"多数派…道連れ脱落",enable:false}); });
    cd.textContent="🔴"+c[0]+" / 🔵"+c[1]+" → "+OPTIONS[minoritySide].slice(0,2)+"の少数派が勝ち！"; cd.style.color="var(--lime)";
    alive=survivors; await sleep(1600);
  }
  endInputs();
  // 結果表示：各ラウンドの内訳（何人ずつ）＋最終生存
  let dt='<div class="detail-title">各ラウンドの内訳（少ない方が生存）</div><div class="detail-list">';
  roundLog.forEach(L=>{ const res=L.winSide===null?"同数で全員セーフ":(OPTIONS[L.winSide].slice(0,2)+"少数派が勝ち"); dt+='<div class="drow"><span class="dnm">第'+L.r+'回</span><span class="dval">🔴'+L.c0+' / 🔵'+L.c1+' → '+res+'</span></div>'; });
  dt+='</div>';
  dt+='<div class="detail-title">最終生存</div>'+detailRows(alive.map(id=>({id, val:"生き残り 👑"})));
  resultDetail=dt;
  // 最後まで残った少数派が上位。脱落は遅い順に上位（生存＞遅く脱落＞早く脱落）。
  return [...alive, ...elim.reverse()];
}

// 丸太ジャンプ：丸太が来た瞬間にジャンプ(押す)。早すぎ・未ジャンプは被弾。生き残り＆越えた数で順位。
// 丸太ジャンプ：プレイヤーを横一列に並べ、丸太が右から左へ転がってくる。自分の所に来た瞬間に押してジャンプ！よけよう。
async function gameMaruta(){
  $("stage").innerHTML='<div class="arena"></div>';
  const arena=$("stage").querySelector(".arena");
  const n=players.length, margin=10, span=100-margin*2;
  const xs={}, toks={};
  const size=Math.max(30,Math.min(52, 380/Math.sqrt(n+1)));
  players.forEach((p,i)=>{
    const x = n<=1 ? 50 : margin + span*(i/(n-1));
    xs[p.id]=x;
    const tok=document.createElement("div"); tok.className="dot"; tok.id="dot"+p.id;
    tok.style.width=size+"px"; tok.style.height=size+"px"; tok.style.fontSize=Math.max(11,size*0.28)+"px";
    tok.style.background=p.color; tok.textContent=p.name.slice(0,2);
    tok.style.left="calc("+x+"% - "+(size/2)+"px)"; tok.style.bottom="20%"; tok.style.transition="bottom .16s ease-out";
    arena.appendChild(tok); toks[p.id]=tok;
  });
  const ground=document.createElement("div");
  ground.style.cssText="position:absolute;left:0;right:0;bottom:18%;height:4px;background:rgba(255,255,255,.25);";
  arena.appendChild(ground);
  const log=document.createElement("div");
  log.textContent="🪵"; log.style.cssText="position:absolute;bottom:15.5%;font-size:clamp(30px,7vw,60px);";
  arena.appendChild(log);
  const cd=addCountdown("よういドン！"); cd.style.top="8%"; cd.style.fontSize="clamp(18px,3vw,28px)"; cd.style.color="var(--gold)";
  broadcast({type:"prompt", text:"丸太が来たらジャンプ！\n（押すとジャンプ）", ui:"tap", enable:true});
  await sleep(1000);

  const alive=new Set(players.map(p=>p.id)); const elim=[];
  const dodgeCount={}; players.forEach(p=>dodgeCount[p.id]=0);
  const jumping={};
  const HITBOX=6, START=106, END=-8;
  const passes=6;
  for(let r=1; r<=passes && alive.size>0; r++){
    const dur=Math.max(1500, 3200-r*260);
    const hitThisPass=new Set();
    let logX=START;
    log.style.left=logX+"%";
    const t0=performance.now();
    pressHandler=(id)=>{
      if(!alive.has(id) || jumping[id]) return;
      jumping[id]=true; sfx("press");
      const el=toks[id]; if(el) el.style.bottom="38%";
      setTimeout(()=>{ jumping[id]=false; const el2=toks[id]; if(el2 && alive.has(id)) el2.style.bottom="20%"; }, 300);
    };
    players.forEach(p=>{ if(p.cpu && alive.has(p.id)){
      const arrival=((START-xs[p.id])/(START-END))*dur;
      const err=(Math.random()*2-1)*220;
      ct(()=>{ if(pressHandler) pressHandler(p.id); }, Math.max(0,arrival+err));
    }});
    await new Promise(res=>{ (function loop(){
      const e=performance.now()-t0;
      logX = START - (START-END)*(e/dur);
      log.style.left=logX+"%";
      alive.forEach(id=>{ if(hitThisPass.has(id)) return;
        if(Math.abs(logX-xs[id])<HITBOX && !jumping[id]){ hitThisPass.add(id); flash(id,true); }
      });
      if(e>=dur) res(); else requestAnimationFrame(loop);
    })(); });
    pressHandler=null; clearCpu();
    alive.forEach(id=>{ if(!hitThisPass.has(id)) dodgeCount[id]++; });
    hitThisPass.forEach(id=>{ alive.delete(id); elim.push(id); sendToId(id,{type:"prompt",text:"丸太に当たった！",enable:false}); });
    cd.textContent = alive.size>0 ? ("丸太 "+r+"本目クリア！") : "全滅…";
    await sleep(650);
  }
  endInputs();
  const survivors=[...alive].sort((a,b)=>dodgeCount[b]-dodgeCount[a]);
  const ranking=[...survivors, ...elim.reverse()];
  const rows=ranking.map(id=>({id, val: alive.has(id)?("完走！"+dodgeCount[id]+"本よけた 🏆"):(dodgeCount[id]+"本よけて被弾"), dead:!alive.has(id)}));
  resultDetail='<div class="detail-title">丸太を何本よけた？</div>'+detailRows(rows);
  return ranking;
}

// 3の倍数で押すな：数字をリズム表示。safe数字は押す／3の倍数・3の付く数は押さない。間違えたら脱落。
async function gameSan3(){
  renderArena();
  const cd=addCountdown("用意…");
  broadcast({type:"prompt", text:"数字でリズム押し！\n3の倍数・3の付く数は押すな", ui:"tap", enable:true});
  const alive=new Set(players.map(p=>p.id)); const elim=[]; let lastNum=0, beat=475; // テンポ2倍速
  await sleep(600);
  for(let n=1; n<=30 && alive.size>1; n++){
    lastNum=n;
    const ng=(n%3===0)||String(n).includes("3");
    const tapped=new Set();
    pressHandler=(id)=>{ if(alive.has(id)){ tapped.add(id); flash(id); } };
    cd.textContent=n+(ng?" 🚫":""); cd.style.color= ng ? "var(--hot)" : "var(--lime)";
    if(!ng) sfx("count");
    const acc=Math.max(0.7, 0.97 - n*0.008);
    players.forEach(p=>{ if(p.cpu && alive.has(p.id)){
      if(ng){ if(Math.random()>acc) ct(()=>{ if(pressHandler) pressHandler(p.id); }, Math.random()*beat*0.8); }
      else { if(Math.random()<acc) ct(()=>{ if(pressHandler) pressHandler(p.id); }, 100+Math.random()*beat*0.7); }
    }});
    await sleep(beat);
    pressHandler=null; clearCpu();
    const wrong=[];
    alive.forEach(id=>{ const t=tapped.has(id); if(ng && t) wrong.push(id); else if(!ng && !t) wrong.push(id); });
    wrong.forEach(id=>{ alive.delete(id); elim.push(id); flash(id,true); sendToId(id,{type:"prompt",text:(ng?"押しちゃダメ！":"押し忘れ！")+" 脱落",enable:false}); });
    beat=Math.max(240, beat-9);
    await sleep(130);
  }
  endInputs();
  const ranking=[...alive, ...elim.reverse()];
  const rows=ranking.map(id=>({id, val: alive.has(id)?("生き残り👑（"+lastNum+"まで）"):"脱落", dead:!alive.has(id)}));
  resultDetail='<div class="detail-title">どこまで耐えた？（3の倍数・3の付く数は押すな）</div>'+detailRows(rows);
  return ranking;
}

// 早撃ちガンマン：約3割が🎯標的。標的以外は早押しで得点／標的が押す・フライングは負け。
async function gameGunman(){
  renderArena();
  const cd=addCountdown("だれが標的…？"); cd.style.color="var(--gold)";
  const ids=players.map(p=>p.id);
  let nT=Math.max(1, Math.round(ids.length*0.3)); nT=Math.min(nT, Math.max(0, ids.length-1));
  const targets=new Set(shuffle(ids).slice(0, nT));
  broadcast({type:"prompt", text:"まもなく標的が発表される…", ui:"wait", enable:false});
  await sleep(1100);
  // 3・2・1 → 標的の名前を一斉発表（直前まで誰が標的かわからない演出）
  for(let i=3;i>=1;i--){ cd.textContent=i; cd.style.fontSize="clamp(60px,16vw,150px)"; sfx("count"); await sleep(650); }
  const targetNames=[...targets].map(id=>pname(id)).join("・");
  cd.style.fontSize="clamp(22px,4.2vw,40px)"; cd.style.color="var(--hot)"; cd.textContent="🎯 "+targetNames;
  sfx("lose"); screenFlash();
  players.forEach(p=>{ const tgt=targets.has(p.id); const d=$("dot"+p.id); if(d && tgt) d.textContent="🎯";
    sendToId(p.id,{type:"prompt", text: tgt?"🎯あなたは標的！\n撃つな（押すな）":"あなたは撃ち手！\n早押しで撃て", ui:"tap", enable:false}); });
  await sleep(1500);
  const times={}; const fouls=new Set(); let go=false, goAt=0;
  cd.textContent="構え…"; cd.style.fontSize="clamp(60px,16vw,150px)"; cd.style.color="#fff";
  broadcast({type:"prompt", text:"まだ…（標的は押すな）", enable:true});
  pressHandler=(id)=>{
    if(targets.has(id)){ if(!fouls.has(id)){ fouls.add(id); flash(id,true); sendToId(id,{type:"prompt",text:"標的なのに撃った…負け",enable:false}); } return; }
    if(!go){ if(times[id]===undefined){ times[id]="foul"; flash(id,true); sendToId(id,{type:"prompt",text:"早すぎ！フライング",enable:false}); } return; }
    if(times[id]===undefined){ times[id]=performance.now()-goAt; flash(id); }
  };
  await sleep(900+Math.random()*1700);
  go=true; goAt=performance.now(); cd.textContent="撃て！🔫"; cd.style.color="var(--lime)"; sfx("go");
  broadcast({type:"prompt", text:"撃て！（標的以外）", enable:true});
  players.forEach(p=>{ if(p.cpu){ if(targets.has(p.id)){ if(Math.random()<0.15) ct(()=>{ if(pressHandler) pressHandler(p.id); }, Math.random()*1500); }
    else ct(()=>{ if(pressHandler) pressHandler(p.id); }, 150+Math.random()*500); } });
  await sleep(1100);
  endInputs();
  const shooters=ids.filter(id=>!targets.has(id));
  const valid=shooters.filter(id=>typeof times[id]==="number").sort((a,b)=>times[a]-times[b]);
  const shooterFail=shooters.filter(id=>typeof times[id]!=="number");
  const targetSafe=ids.filter(id=>targets.has(id) && !fouls.has(id));
  const targetFoul=ids.filter(id=>targets.has(id) && fouls.has(id));
  const ranking=[...valid, ...shooterFail, ...targetSafe, ...targetFoul];
  const rows=[];
  valid.forEach(id=>rows.push({id, val:Math.round(times[id])+"ms ⚡撃った"}));
  shooterFail.forEach(id=>rows.push({id, val: times[id]==="foul"?"フライング✗":"撃てず", dead:true}));
  targetSafe.forEach(id=>rows.push({id, val:"🎯標的（撃たずセーフ）"}));
  targetFoul.forEach(id=>rows.push({id, val:"🎯標的なのに撃った✗", dead:true}));
  resultDetail='<div class="detail-title">早撃ち結果（🎯標的は撃ったら負け）</div>'+detailRows(rows);
  return ranking;
}

// 秒数当て：指定秒ピッタリで押す。最初の3秒だけ時計表示、その後は「？」。誤差が小さい順。

    const votes={}; alive.forEach(id=>votes[id]=0);

    alive.forEach(id=>{ const d=$("dot"+id); if(d) d.classList.remove("dead"); });
    pressHandler=(id)=>{ if(!alive.includes(id)) return; votes[id]=((votes[id]||0)+1)%3; flash(id); };
    alive.forEach(id=>{ const p=players.find(x=>x.id===id); if(p&&p.cpu){ const taps=Math.floor(Math.random()*4); for(let k=0;k<taps;k++) ct(()=>{ if(pressHandler) pressHandler(id); }, 200+Math.random()*2200); } });
    const parityTag=addCountdown("今回は【"+parityLabel+"】が生き残り！");
    parityTag.style.top="9%"; parityTag.style.fontSize="clamp(18px,3vw,28px)"; parityTag.style.color= parity===0 ? "var(--cool)" : "var(--hot)";
    const cd=addCountdown("3");
    for(let i=3;i>=1;i--){ cd.textContent=i; sfx("count"); await sleep(850); }
    cd.textContent="オープン！"; sfx("go"); endInputs();
    const c=[0,0,0]; alive.forEach(id=>c[votes[id]]++);
    const okGroup=[0,1,2].filter(g=>c[g]>0 && (c[g]%2)===parity);
    log.push({r:roundNo, c:[...c], parity});
    await sleep(500);
    if(okGroup.length===0){ cd.textContent="該当グループなし！全員セーフ"; cd.style.color="var(--cool)"; await sleep(1300); continue; }
    const survivors=alive.filter(id=>okGroup.includes(votes[id]));
    const losers=alive.filter(id=>!okGroup.includes(votes[id]));
    losers.forEach(id=>{ flash(id,true); elim.push(id); if(!players.find(p=>p.id===id).cpu) sendToId(id,{type:"prompt",text:"パリティ外…脱落",enable:false}); });
    cd.textContent=(parity===0?"偶数":"奇数")+"人数のグループが生存！"; cd.style.color="var(--lime)";
    alive=survivors; await sleep(1500);
  }
  endInputs();
  let dt='<div class="detail-title">各ラウンドの投票（A/B/C人数 → 指定パリティが生存）</div><div class="detail-list">';
  log.forEach(L=>{ dt+='<div class="drow"><span class="dnm">第'+L.r+'回 '+(L.parity===0?"偶数":"奇数")+'</span><span class="dval">A'+L.c[0]+' / B'+L.c[1]+' / C'+L.c[2]+'</span></div>'; });
  dt+='</div><div class="detail-title">最終生存</div>'+detailRows(alive.map(id=>({id, val:"生き残り👑"})));
  resultDetail=dt;
  return [...alive, ...elim.reverse()];
}

// お題早押し：お題（赤い/食べ物/動物/丸い）に合うものが出たら早押し。ダミー（非該当）に押すとフライング。
async function gameOdai(){
  renderArena();
  const RULES=[
    {q:"赤いものが出たら押せ！",   yes:["🍎","🍓","🌶️","🍅","🚗","❤️"], no:["🍌","🥦","🐟","🌙","🧊","🍐","🔵"]},
    {q:"たべものが出たら押せ！",   yes:["🍎","🍣","🍔","🍌","🍙","🍕"], no:["🚗","🐶","🌙","⚽","✏️","🎩"]},
    {q:"動物が出たら押せ！",       yes:["🐶","🐱","🐘","🦁","🐸","🐧"], no:["🍎","🚗","🌙","🎩","🍣","⚽"]},
    {q:"丸いものが出たら押せ！",   yes:["⚽","🍊","🌕","🔴","🍡","🏀"], no:["📏","✏️","🍌","📐","🔺","🚪"]},
  ];
  const R=RULES[Math.floor(Math.random()*RULES.length)];
  const cd=addCountdown(R.q); cd.style.fontSize="clamp(22px,4vw,40px)";
  broadcast({type:"prompt", text:R.q+"\n（それ以外は押すな）", ui:"tap", enable:true});
  await sleep(1900);
  const times={}; const fouled=new Set(); let isTarget=false, goAt=0;
  pressHandler=(id)=>{
    if(fouled.has(id)||times[id]!==undefined) return;
    if(isTarget){ times[id]=performance.now()-goAt; flash(id); }
    else { fouled.add(id); flash(id,true); sendToId(id,{type:"prompt",text:"お題ちがい！フライング",enable:false}); }
  };
  const decoys=2+Math.floor(Math.random()*2);
  for(let k=0;k<decoys;k++){
    isTarget=false; const item=R.no[Math.floor(Math.random()*R.no.length)];
    cd.textContent=item; cd.style.color="#fff"; cd.style.fontSize="clamp(60px,14vw,130px)";
    players.forEach(p=>{ if(p.cpu && !fouled.has(p.id) && times[p.id]===undefined && Math.random()<0.08) ct(()=>{ if(pressHandler) pressHandler(p.id); }, Math.random()*700); });
    await sleep(800+Math.random()*500);
  }
  isTarget=true; goAt=performance.now(); const t=R.yes[Math.floor(Math.random()*R.yes.length)];
  cd.textContent=t; cd.style.color="var(--lime)"; sfx("go");
  broadcast({type:"prompt", text:"出た！押せ！", enable:true});
  players.forEach(p=>{ if(p.cpu && !fouled.has(p.id)) ct(()=>{ if(pressHandler) pressHandler(p.id); }, 180+Math.random()*600); });
  await sleep(1100);
  endInputs();
  const valid=Object.keys(times).map(Number).sort((a,b)=>times[a]-times[b]);
  const noPress=players.map(p=>p.id).filter(id=>times[id]===undefined && !fouled.has(id));
  const fouls=[...fouled];
  const ranking=[...valid, ...noPress, ...fouls];
  const rows=[];
  valid.forEach(id=>rows.push({id, val:Math.round(times[id])+"ms ⚡正解"}));
  noPress.forEach(id=>rows.push({id, val:"押さず", dead:true}));
  fouls.forEach(id=>rows.push({id, val:"お題ちがい✗", dead:true}));
  resultDetail='<div class="detail-title">お題：'+R.q+'</div>'+detailRows(rows);
  return ranking;
}

// 最速◯回：規定回数を最速連打。🔒ロック中に押すと回数が減る。先に達成した順＝上位。
async function gameRepeat(){
  renderArena();
  const TARGET=18;
  const cd=addCountdown("用意…");
  broadcast({type:"prompt", text:TARGET+"回 最速で連打！\n🔒ロック中は押すな（減点）", ui:"tap", enable:true});
  const cnt={}; players.forEach(p=>cnt[p.id]=0);
  const finished=[]; let locked=false, stop=false;
  pressHandler=(id)=>{
    if(finished.includes(id)) return;
    if(locked){ cnt[id]=Math.max(0,cnt[id]-5); flash(id,true); sendToId(id,{type:"prompt",text:"🔒ロック中！減点",enable:true}); }
    else { cnt[id]++; if(cnt[id]%5===0) flash(id);
      if(cnt[id]>=TARGET){ finished.push(id); sendToId(id,{type:"prompt",text:"達成！🎉",enable:false}); const d=$("dot"+id); if(d) d.style.boxShadow="0 0 0 4px var(--gold)"; } }
  };
  await sleep(1000); cd.textContent="START！"; cd.style.color="var(--lime)"; sfx("go");
  broadcast({type:"prompt", text:"連打！", enable:true});
  players.forEach(p=>{ if(p.cpu){ const iv=setInterval(()=>{ if(!pressHandler||finished.includes(p.id)) return; if(locked){ if(Math.random()<0.25) pressHandler(p.id); } else pressHandler(p.id); }, 90+Math.random()*120); cpuIntervals.push(iv); } });
  (async()=>{ while(!stop){ await sleep(1300+Math.random()*1400); if(stop) break;
      locked=true; cd.textContent="🔒ロック！"; cd.style.color="var(--hot)"; broadcast({type:"prompt",text:"🔒今は押すな！",enable:true});
      await sleep(550+Math.random()*450); if(stop) break;
      locked=false; cd.textContent="連打！"; cd.style.color="var(--lime)"; broadcast({type:"prompt",text:"連打OK！",enable:true}); } })();
  const DUR=13000, t0=performance.now();
  while(performance.now()-t0<DUR && finished.length<players.length && finished.length<Math.min(3,players.length)){ await sleep(150); }
  stop=true; endInputs();
  const rest=players.map(p=>p.id).filter(id=>!finished.includes(id)).sort((a,b)=>cnt[b]-cnt[a]);
  const ranking=[...finished, ...rest];
  const rows=ranking.map(id=>({id, val: finished.includes(id)?("達成！"+(finished.indexOf(id)+1)+"着 🏁"):(cnt[id]+"/"+TARGET+"回")}));
  resultDetail='<div class="detail-title">'+TARGET+'回連打レース（🔒ロック中の押下は減点）</div>'+detailRows(rows);
  return ranking;
}

// 果物カウント：果物が1個ずつ動画のように出現→数えて→ボタン連打のカウンターで回答。正確さ順。
async function gameFruit(){
  renderArena();
  const arena=$("stage").querySelector(".arena");
  const FRUITS=["🍎","🍌","🍇","🍓","🍊"];
  const targetFruit=FRUITS[Math.floor(Math.random()*FRUITS.length)];
  const total=16+Math.floor(Math.random()*10);
  let targetCount=0;
  const field=document.createElement("div"); field.style.cssText="position:absolute;inset:16% 6% 20% 6%;";
  arena.appendChild(field);
  const cd=addCountdown(targetFruit+" を数えろ！"); cd.style.top="7%"; cd.style.fontSize="clamp(20px,3.4vw,32px)"; cd.style.color="var(--gold)";
  broadcast({type:"prompt", text:targetFruit+" の数を数えて！\n（あとでカウンターで答える）", ui:"wait", enable:false});
  await sleep(1300);
  // 動画のように1個ずつランダムな位置にポップ表示（数えやすいテンポで出現）
  const used=[];
  for(let i=0;i<total;i++){
    const f=FRUITS[Math.floor(Math.random()*FRUITS.length)]; if(f===targetFruit) targetCount++;
    let left,top,tries=0;
    do{ left=4+Math.random()*84; top=4+Math.random()*84; tries++; }
    while(tries<10 && used.some(u=>Math.abs(u.left-left)<11 && Math.abs(u.top-top)<14));
    used.push({left,top});
    const s=document.createElement("span");
    s.textContent=f;
    s.style.cssText="position:absolute;font-size:clamp(26px,4.6vw,48px);opacity:0;transform:scale(.2);left:"+left+"%;top:"+top+"%;transition:opacity .16s ease-out, transform .16s ease-out;";
    field.appendChild(s);
    void s.offsetWidth;
    s.style.opacity="1"; s.style.transform="scale(1)";
    if(f===targetFruit) sfx("count");
    await sleep(140+Math.random()*110);
  }
  await sleep(1000);
  field.remove();
  cd.textContent=targetFruit+" は何個だった？"; cd.style.color="var(--lime)"; sfx("go");
  broadcast({type:"prompt", text:targetFruit+" は何個だった？\n押すたび+1でかぞえて答える", ui:"counter", enable:true});
  const counts={}; players.forEach(p=>counts[p.id]=0);
  pressHandler=(id)=>{ counts[id]=(counts[id]||0)+1; flash(id); };
  players.forEach(p=>{ if(p.cpu){ const guess=Math.max(0, targetCount+Math.floor(Math.random()*5-2)); for(let k=0;k<guess;k++) ct(()=>{ if(pressHandler) pressHandler(p.id); }, 300+Math.random()*4200); } });
  const cd2=addCountdown("6"); cd2.style.top="66%";
  for(let i=6;i>=1;i--){ cd2.textContent=i; sfx("count"); await sleep(1000); }
  cd2.textContent="しめきり！"; sfx("go"); endInputs();
  const ranking=players.map(p=>p.id).sort((a,b)=>Math.abs(counts[a]-targetCount)-Math.abs(counts[b]-targetCount));
  const rows=ranking.map(id=>({id, val: counts[id]+"個"+(counts[id]===targetCount?" ◎正解":"（誤差"+Math.abs(counts[id]-targetCount)+"）"), dead: counts[id]!==targetCount}));
  resultDetail='<div class="detail-title">正解：'+targetFruit+' は '+targetCount+'個</div>'+detailRows(rows);
  return ranking;
}

// ===== 表示・採点 =====
function addCountdown(txt){
  const arena=$("stage").querySelector(".arena")||$("stage");
  const cd=document.createElement("div"); cd.className="countdown"; cd.textContent=txt;
  cd.style.position="absolute"; cd.style.left="50%"; cd.style.top="50%"; cd.style.transform="translate(-50%,-50%)";
  arena.appendChild(cd); return cd;
}
function renderArena(){
  $("stage").innerHTML='<div class="arena"></div>';
  const arena=$("stage").querySelector(".arena"); const n=players.length;
  const size=Math.max(34, Math.min(60, 460/Math.sqrt(n+1)));
  const rx=n<=1?0:36, ry=n<=1?0:34;
  players.forEach((p,i)=>{
    const d=document.createElement("div"); d.className="dot"; d.id="dot"+p.id;
    d.style.width=size+"px"; d.style.height=size+"px"; d.style.fontSize=Math.max(11,size*0.26)+"px";
    d.style.background=p.color; d.textContent=p.name.slice(0,3);
    const a=(i/n)*Math.PI*2 - Math.PI/2, cx=50+Math.cos(a)*rx, cy=50+Math.sin(a)*ry;
    d.style.left="calc("+cx+"% - "+(size/2)+"px)"; d.style.top="calc("+cy+"% - "+(size/2)+"px)";
    arena.appendChild(d);
  });
}
function flash(id,dead){ const d=$("dot"+id); if(!d) return; d.animate([{transform:"scale(1)"},{transform:"scale(1.4)"},{transform:"scale(1)"}],{duration:200}); if(dead){ d.classList.add("dead"); sfx("lose"); } }
function renderBoard(){
  const sorted=[...players].sort((a,b)=>(scores[b.id]||0)-(scores[a.id]||0));
  const board=$("board"); board.innerHTML="";
  sorted.forEach((p,i)=>{ const row=document.createElement("div"); row.className="scrow";
    row.innerHTML='<span class="rk">'+(i+1)+'</span><span class="swatch" style="background:'+p.color+'"></span><span class="nm">'+p.name+(p.host?" 🎮":(p.cpu?" 🤖":""))+'</span><span class="pt">'+(scores[p.id]||0)+' pt</span>';
    board.appendChild(row); });
}

// 結果表示（3・2・1加点）＋ ☆評価
async function showResult(game, ranking){
  const top=ranking.slice(0,3);
  top.forEach((id,i)=>{ scores[id]=(scores[id]||0)+(3-i); });
  const medals=["🥇","🥈","🥉"];
  let html='<div style="text-align:center"><div class="sub">'+game.title+' けっか</div>';
  if(top.length){
    html+='<div class="result-top">';
    top.forEach((id,i)=>{ const p=players.find(x=>x.id===id); if(p) html+='<div class="rwin" style="color:'+p.color+'">'+medals[i]+' '+p.name+' <small>+'+(3-i)+'</small></div>'; });
    html+='</div>';
  }else{ html+='<div class="winner">勝者なし…</div>'; }
  if(resultDetail) html+='<div class="result-detail">'+resultDetail+'</div>';
  html+='<div class="rate-wrap"><div class="sub">面白さは？（デバッグ評価）</div><div class="rate-row" id="rateRow"></div></div></div>';
  $("stage").innerHTML=html;
  if(top.length){ sfx("win"); screenFlash(); partyBurst(); }
  top.forEach(id=>{ if(!players.find(p=>p.id===id).cpu) sendToId(id,{type:"prompt",text:"入賞！🎉",enable:false}); });
  await showRating(game);
}
function showRating(game){
  return new Promise(res=>{
    const row=$("rateRow"); if(!row){ res(); return; }
    const stars=[];
    for(let s=1;s<=3;s++){ const b=document.createElement("button"); b.className="star-btn"; b.textContent="☆"; b.dataset.n=s; b.onclick=()=>{ saveRating(game.key,s); paintStars(stars,s); }; row.appendChild(b); stars.push(b); }
    const nx=document.createElement("button"); nx.className="startbtn"; nx.style.marginLeft="14px"; nx.textContent="つぎへ ▶"; nx.onclick=()=>res(); row.appendChild(nx);
    if(ratings[game.key]) paintStars(stars, ratings[game.key]);
  });
}
function paintStars(stars,n){ stars.forEach((b,i)=>{ const on=i<n; b.textContent=on?"★":"☆"; b.classList.toggle("on",on); }); }
function saveRating(key,stars){ ratings[key]=stars; saveData("oshiking-ratings", ratings); }

async function showFinal(){
  const sorted=[...players].sort((a,b)=>(scores[b.id]||0)-(scores[a.id]||0));
  const champ=sorted[0];
  $("roundLabel").textContent="結果発表";
  $("stage").innerHTML='<div style="text-align:center"><div class="sub">総合優勝</div>'+
    '<div class="winner" style="color:'+champ.color+'">👑 '+champ.name+'</div>'+
    '<div class="sub">'+(scores[champ.id]||0)+' pt</div></div>';
  sfx("fanfare"); screenFlash(); partyBurst(); setTimeout(partyBurst,700);
  players.forEach(p=>{ if(!p.cpu) sendTo(p,{type:"prompt", text:(p.id===champ.id?"優勝！！👑":"おつかれさま！"), enable:false}); });
  renderBoard(); await sleep(2600);
}

/* ============================================================
   コントローラー側（スマホ）
   ============================================================ */
let myConn=null, myCurrentUi="tap";
let cycleHand=0; const HANDS=["✊ グー","✌ チョキ","✋ パー"];
let myCycleOptions=HANDS;  // cycle時の選択肢（prompt.optionsで上書き、無ければHANDS）
let myCounter=0;          // counter時：押すたび+1で数える自分の回答値

function ctrl_init(){
  $("ctrlView").classList.remove("hidden");
  if(typeof Peer==="undefined"){ $("connBanner").textContent="通信ライブラリ読込失敗。再読み込みしてね"; return; }
  const peer=new Peer(); window._peer=peer;
  peer.on("open", ()=>{
    const conn=peer.connect(ROOM, {reliable:true}); myConn=conn;
    conn.on("open", ()=>{ $("connBanner").textContent="接続OK！なまえを入れてね"; });
    conn.on("data", msg=>handleCtrlMessage(msg));
    conn.on("close", ()=>{ setStatus("ホストとの接続が切れました"); });
  });
  peer.on("error", e=>{ $("connBanner").textContent="接続エラー："+(e&&e.type?e.type:"")+"（ルームID確認）"; });

  $("joinBtn").onclick=()=>{
    sfxInit();
    const name=($("nameInput").value||"").trim().slice(0,8) || "ななし";
    if(!myConn||!myConn.open){ $("connBanner").textContent="まだ接続中…少し待ってね"; return; }
    myConn.send({type:"join", name:name});
    $("ctrlName").textContent=name;
    $("nameScreen").classList.add("hidden"); $("playScreen").classList.remove("hidden");
    setStatus("スタート待ち…");
  };
  const tap=$("tap");
  tap.addEventListener("pointerdown", e=>{ e.preventDefault(); sfxInit(); if(myConn&&myConn.open&&!tap.disabled){ sfx("press"); myConn.send({type:"press", t:Date.now()}); } });
}
function handleCtrlMessage(msg){
  if(!msg||!msg.type) return;
  if(msg.type==="welcome"){ if(msg.name) $("ctrlName").textContent=msg.name; return; }
  if(msg.type==="prompt"){
    if(msg.ui) myCurrentUi=msg.ui;
    if(msg.ui==="cycle"){ cycleHand=0; myCycleOptions=(msg.options&&msg.options.length)?msg.options:HANDS; setStatus(msg.text+"\n今："+myCycleOptions[0]); }
    else if(msg.ui==="counter"){ myCounter=0; setStatus(msg.text+"\n今のかず：0"); }
    else setStatus(msg.text);
    if(typeof msg.enable==="boolean") setEnabled(msg.enable);
    return;
  }
  if(msg.type==="enable"){ setEnabled(!!msg.on); return; }
}
function setStatus(t){ $("phoneStatus").textContent=t; }
function setEnabled(on){
  const tap=$("tap"); tap.disabled=!on;
  if(myCurrentUi==="cycle"){
    // cycle系（3すくみ・少数決・偶奇投票）：ボタンに「今の選択」を大きく表示
    tap.textContent=myCycleOptions[cycleHand];
    tap.onclick = on ? (()=>{ cycleHand=(cycleHand+1)%myCycleOptions.length; tap.textContent=myCycleOptions[cycleHand]; setStatus("今の選択：\n"+myCycleOptions[cycleHand]); }) : null;
  }else if(myCurrentUi==="counter"){
    // counter系（果物カウント）：押すたび+1でボタンに現在の数を表示
    tap.textContent=String(myCounter);
    tap.onclick = on ? (()=>{ myCounter++; tap.textContent=String(myCounter); setStatus("今のかず：\n"+myCounter); }) : null;
  }else{
    tap.textContent="OSU!"; tap.onclick=null;
  }
}

/* ===== 起動 ===== */
if(ROOM){ ctrl_init(); } else { host_init(); }
