name: Check Cookies (事前診断)

# クッキーが有効か投稿せずに確認する
# 失敗時のスクリーンショットをArtifactで取れる → 何が起きてるか見える化

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: projects/rakuda-sensei/automation/requirements.txt
      - run: pip install -r projects/rakuda-sensei/automation/requirements.txt
      - run: playwright install chromium --with-deps

      - name: Diagnose cookies
        env:
          NOTE_SESSION_COOKIE: ${{ secrets.NOTE_SESSION_COOKIE }}
          BOOTH_SESSION_COOKIE: ${{ secrets.BOOTH_SESSION_COOKIE }}
        run: python projects/rakuda-sensei/automation/check_cookies.py

      - name: Upload diagnostic screenshots
        if: always()  # 成功でも失敗でもスクショ保存
        uses: actions/upload-artifact@v4
        with:
          name: cookie-diagnostic-screenshots
          path: "*.png"
          if-no-files-found: warn
          retention-days: 7
