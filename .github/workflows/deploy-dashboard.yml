name: Deploy Sites to GitHub Pages

# dashboard/ または rough/ が更新されたら自動デプロイ
# 初回のみ手動セットアップ必要: Settings > Pages > Source: "GitHub Actions"
# デプロイ先:
#   ダッシュボード: gamigamiigami.github.io/Workspace/
#   ボドゲ会サイト: gamigamiigami.github.io/Workspace/rough/

on:
  push:
    branches:
      - main
      - claude/workspace-knowledge-base-setup-ccVKP
    paths:
      - "projects/rakuda-sensei/dashboard/**"
      - "projects/rough/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build combined site
        run: |
          mkdir -p site/rough
          cp -r projects/rakuda-sensei/dashboard/. site/
          cp -r projects/rough/. site/rough/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
