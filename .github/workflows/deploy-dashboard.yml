name: Deploy Sites to GitHub Pages (DISABLED — superseded by deploy-pages.yml)

# ⚠️ このワークフローは廃止（自動実行を停止）した。
# 後継 deploy-pages.yml（whitelist方式）が公開を担当する。
# 理由：両方が同じ "pages" 環境にデプロイして競合し、URL構造が入れ替わって404が発生していた。
#       また旧方式は projects/rakuda-sensei/dashboard を公開していたが、機密を含むため
#       新方式では意図的に非公開化している。安全のため旧方式は自動実行しない。
# 復活させたい場合だけ手動（workflow_dispatch）で実行できる。

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build combined site
        run: |
          mkdir -p site/rough site/hinshi-panic site/kaeriten-quest site/keisan-quest
          cp -r projects/rakuda-sensei/dashboard/. site/
          cp -r projects/rough/. site/rough/
          cp -r projects/hinshi-panic/. site/hinshi-panic/
          cp -r projects/kaeriten-quest/. site/kaeriten-quest/
          cp -r projects/keisan-quest/. site/keisan-quest/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
