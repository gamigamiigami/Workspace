name: Deploy Dashboard to GitHub Pages

# dashboard/ 配下が更新されたらGitHub Pagesに自動デプロイ
# 初回のみ手動セットアップ必要: Settings > Pages > Source: "GitHub Actions"

on:
  push:
    branches:
      - main
      - claude/workspace-knowledge-base-setup-ccVKP
    paths:
      - "projects/rakuda-sensei/dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"


concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: projects/rakuda-sensei/dashboard

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
