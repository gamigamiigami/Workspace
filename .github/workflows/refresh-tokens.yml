name: Refresh Meta Tokens

# Meta（Threads/Instagram）の長期トークンを50日ごとに自動延長
# これで実質「永久に有効」になる

on:
  schedule:
    - cron: "0 3 1,15 * *"  # 月2回 (1日 / 15日) 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: projects/rakuda-sensei/automation/requirements.txt
      - run: pip install -r projects/rakuda-sensei/automation/requirements.txt

      - name: Refresh Meta tokens
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python projects/rakuda-sensei/automation/refresh_meta_tokens.py

      - name: Notify failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🚨 Metaトークン延長失敗 ($(date +%Y-%m-%d))" \
            --body "Metaトークンの自動延長が失敗しました。

          **対応**:
          1. \`setup/meta-api-setup.md\` の手順4「長期トークンに変換」を再実行
          2. 新しいトークンを \`META_ACCESS_TOKEN\` / \`THREADS_ACCESS_TOKEN\` に再登録

          **実行ログ**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "bug,automation"
