name: Weekly X Content Generation

# 毎週金曜21:00 UTC = 土曜06:00 JST にGitHub Models(無料)で翌週分のX投稿14本を生成
# GITHUB_TOKEN を models:read 権限付きで使用 = 追加課金・追加設定なし
# 手動トリガーも可能(動作確認用)

on:
  schedule:
    - cron: "0 21 * * 5"
  workflow_dispatch:

permissions:
  contents: write
  models: read  # GitHub Models 呼び出しに必要

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: projects/rakuda-sensei/automation/requirements.txt

      - name: Install dependencies
        run: pip install -r projects/rakuda-sensei/automation/requirements.txt

      - name: Generate weekly X posts (via GitHub Models - 無料)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python projects/rakuda-sensei/automation/generate_weekly_x.py

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/rakuda-sensei/sns/weekly/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(automation): 週次X投稿ドラフト自動生成"
            git push
          fi
