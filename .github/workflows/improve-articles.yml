name: Improve Existing Articles

# voice-and-style.md / sales-playbook.md などの知識が更新されたら、
# 既存記事を新知識で再生成して改善版を {name}-v2.md として保存する
# 週次定期 + 知識ファイル更新時の両方で起動

on:
  schedule:
    - cron: "0 3 * * 1"  # 毎週月曜 12:00 JST (03:00 UTC)
  workflow_dispatch:
  push:
    branches:
      - claude/workspace-knowledge-base-setup-ccVKP
      - main
    paths:
      - "knowledge/voice-and-style.md"
      - "knowledge/sales-playbook.md"
      - "knowledge/persona.md"

permissions:
  contents: write
  models: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  improve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: projects/rakuda-sensei/automation/requirements.txt
      - run: pip install -r projects/rakuda-sensei/automation/requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Improve articles
        id: improve
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python projects/rakuda-sensei/automation/improve_existing_articles.py

      - name: Commit improvements
        if: steps.improve.outputs.improved_count != '0'
        run: |
          git add projects/rakuda-sensei/articles/
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): 既存記事の改善版 (-v2.md) 生成"
            for i in 1 2 3 4 5; do
              git pull --rebase origin "${{ github.ref_name }}" || true
              if git push; then exit 0; fi
              sleep $((i * 2))
            done
            exit 1
          fi
