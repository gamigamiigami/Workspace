name: Daily Self Learning (深夜3-6時JST)

# JST 3:00 (UTC 18:00) に起動し、3時間以内に必ず終了させる
# 有料記事の収益化ノウハウを GitHub Models (無料) で毎日学習・蓄積
# 結果は knowledge/learning-log.md と knowledge/sales-playbook.md にコミット

on:
  schedule:
    - cron: "0 18 * * *"  # 18:00 UTC = 3:00 JST (翌日)
  workflow_dispatch:

permissions:
  contents: write
  models: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  learn:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # 最大3時間で必ず終了 → JST 6:00 までに完了保証
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: projects/rakuda-sensei/automation/requirements.txt

      - run: pip install -r projects/rakuda-sensei/automation/requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run self-learning loop
        id: learn
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python projects/rakuda-sensei/automation/daily_self_learning.py

      - name: Commit insights
        if: always()
        run: |
          git add knowledge/learning-log.md knowledge/sales-playbook.md
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): 自己学習結果蓄積 ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
            for i in 1 2 3 4 5; do
              git pull --rebase origin "${{ github.ref_name }}" || true
              if git push; then
                echo "✅ push成功"
                exit 0
              fi
              sleep $((i * 2))
            done
            echo "❌ push失敗"
            exit 1
          fi

      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🚨 自己学習失敗 ($(date +%Y-%m-%d))" \
            --body "深夜の自己学習ループが失敗しました。

          ## 確認
          - GitHub Models の無料枠超過？
          - スクリプト内エラー？

          **実行ログ**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "bug"
