name: Post Note Promo (Threads自動告知)

# note 記事公開後の Threads 告知投稿を担当する。
# X 告知は note の SNS プロモ連携が publish 時に自動投稿するため、ここでは扱わない。
# 日次の X 投稿は post-to-x.yml が cron で実行する。

on:
  push:
    branches:
      - "**"
    paths:
      - "projects/rakuda-sensei/sns/.promo-trigger"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (実投稿せず内容だけ確認)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: projects/rakuda-sensei/automation/requirements.txt

      - run: pip install -r projects/rakuda-sensei/automation/requirements.txt
      - run: playwright install chromium --with-deps

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Post promo to Threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
          fi
          python projects/rakuda-sensei/automation/post_note_promo.py $DRY

      - name: Commit posted log and consume trigger
        if: success() && inputs.dry_run != true
        run: |
          git add projects/rakuda-sensei/sns/.promo-posted.log 2>/dev/null || true
          git rm projects/rakuda-sensei/sns/.promo-trigger 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): note告知投稿ログ更新 + trigger消化"
            for i in 1 2 3 4 5; do
              git pull --rebase origin "${{ github.ref_name }}" || true
              if git push; then exit 0; fi
              sleep $((i * 2))
            done
            exit 1
          fi

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: promo-error-screenshots
          path: "*.png"
          if-no-files-found: ignore
