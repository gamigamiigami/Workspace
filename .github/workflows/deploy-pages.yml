# GitHub Pages へ「公開してよいサイトだけ」をまとめて公開するワークフロー。
#
# ★安全方針（重要）★
#   リポジトリ全体は公開しない。knowledge/（個人情報）・CLAUDE.md・
#   rakuda-sensei（cookie/token等の機密を含む自動化バックエンド）は公開対象外。
#   下の PUBLIC_DIRS に列挙した「index.html を持つ公開用サイト」だけを _site に集めて配信する。
#
# 公開トップ: https://gamigamiigami.github.io/Workspace/
#   - 各サイト: https://gamigamiigami.github.io/Workspace/projects/<name>/
name: Deploy Workspace Sites to Pages

on:
  push:
    branches:
      - claude/workspace-knowledge-base-setup-ccVKP   # 運用ブランチ（Pages公開が許可されているのはここだけ）
    paths:
      - "projects/**"
      - "site/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:   # 手動でも実行できるように

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # Pagesの配信元を「GitHub Actions」に自動設定

      - name: Assemble public site (whitelist only)
        run: |
          set -e
          # 公開してよいサイト（index.html を持つもの）だけを列挙
          PUBLIC_DIRS="travel-planner toy-story-modoki-web hinshi-panic kaeriten-quest keisan-quest rough oshiking crossword moji-zurashi"
          mkdir -p _site/projects
          # トップページ（作品一覧）
          cp site/index.html _site/index.html
          # 各公開サイトをコピー（存在するものだけ）。
          # 旧URL(/<name>/)と新URL(/projects/<name>/)の両方で開けるよう2か所に配置する。
          for d in $PUBLIC_DIRS; do
            if [ -d "projects/$d" ]; then
              cp -r "projects/$d" "_site/projects/$d"   # 新URL: /Workspace/projects/<name>/
              cp -r "projects/$d" "_site/$d"            # 旧URL: /Workspace/<name>/（後方互換）
              echo "published: $d (projects/ と ルート直下 の両方)"
            else
              echo "skip (not found): projects/$d"
            fi
          done
          echo "=== _site tree (top) ==="
          ls -R _site | head -40

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
