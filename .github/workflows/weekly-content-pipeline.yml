name: Weekly Content Pipeline (生成→投稿の完全自動)

# 毎週日曜 21:00 UTC (JST月曜6:00) に下記を全自動実行:
#  1. X週次14本AI生成 (3本柱ローテ)
#  2. note記事1本AI生成 (3本柱ローテ) → 翌日に自動投稿
#  3. BOOTH教材1本AI生成 → ★手動出品★ (BOOTH UIが頻繁に変わり自動化が壊れやすいため)
# すべてGitHub Models (無料) + Playwright/Graph API (無料)
#
# BOOTH手動出品手順: knowledge/booth-manual-guide.md

on:
  schedule:
    - cron: "0 21 * * 0"  # 毎週日曜 21:00 UTC
  workflow_dispatch:
    inputs:
      include_booth:
        description: "BOOTH商品も生成する"
        required: false
        type: boolean
        default: false
      pillar_override:
        description: "note記事の柱を強制指定 (A/B/C・空欄でローテ)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  models: read
  actions: write  # 連鎖ワークフロー起動のため

env:
  # 2026-06-16以降はデフォルトNode 24になるため先取りでopt-in (警告抑制)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # 全生成を1ジョブで完結（並列pushの競合を回避）
  generate-all:
    runs-on: ubuntu-latest
    outputs:
      article_path: ${{ steps.gen-note.outputs.article_path }}
      pillar: ${{ steps.gen-note.outputs.pillar }}
      product_path: ${{ steps.gen-booth.outputs.product_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: projects/rakuda-sensei/automation/requirements.txt

      - run: pip install -r projects/rakuda-sensei/automation/requirements.txt

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # === 1. X週次14本生成 ===
      - name: Generate weekly X posts (3本柱対応)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python projects/rakuda-sensei/automation/generate_weekly_x.py

      - name: Commit X weekly
        run: |
          git add projects/rakuda-sensei/sns/weekly/
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): X週次14本生成 (3本柱)"
          fi

      # === 2. note記事1本生成 ===
      - name: Generate note article (柱ローテ)
        id: gen-note
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PILLAR: ${{ inputs.pillar_override }}
        run: python projects/rakuda-sensei/automation/generate_note_article.py

      - name: Commit note article
        run: |
          git add projects/rakuda-sensei/articles/
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): note記事生成 (柱${{ steps.gen-note.outputs.pillar }})"
          fi

      # === 3. BOOTH教材1本生成（条件付き）===
      - name: Generate BOOTH product (単元ローテ)
        id: gen-booth
        if: ${{ inputs.include_booth == true || github.event_name == 'schedule' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python projects/rakuda-sensei/automation/generate_booth_product.py

      - name: Commit BOOTH product
        if: ${{ inputs.include_booth == true || github.event_name == 'schedule' }}
        run: |
          git add projects/rakuda-sensei/products/
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): BOOTH教材生成"
          fi

      # === 一括push（pull-rebase付き再試行）===
      - name: Push all commits with retry
        run: |
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${{ github.ref_name }}" || true
            if git push; then
              echo "✅ Push成功 (試行 $i)"
              exit 0
            fi
            echo "⏳ Push失敗、$((i * 3))秒待機して再試行..."
            sleep $((i * 3))
          done
          echo "❌ Push最大試行回数到達"
          exit 1

  # note自動投稿起動
  trigger-note-post:
    runs-on: ubuntu-latest
    needs: generate-all
    if: needs.generate-all.outputs.article_path != ''
    steps:
      - name: Trigger post-to-note workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/post-to-note.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}","inputs":{"article_path":"${{ needs.generate-all.outputs.article_path }}","dry_run":false}}'

  # BOOTH手動出品リマインダー（自動出品はBOOTHのUI仕様変更頻度の高さのため停止）
  notify-booth-manual:
    runs-on: ubuntu-latest
    needs: generate-all
    if: needs.generate-all.outputs.product_path != ''
    permissions:
      issues: write
    steps:
      - name: Create issue with manual upload instructions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🛒 BOOTH手動出品 ($(date +%Y-%m-%d)) - 2-3分の作業" \
            --body "新しいBOOTH商品が生成されました。手動で出品してください（2-3分）。

          ## 商品ファイル
          \`${{ needs.generate-all.outputs.product_path }}\`

          ## 出品手順（要約）
          1. ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/${{ needs.generate-all.outputs.product_path }} を開く
          2. ファイル冒頭の \`<!-- BOOTH_TITLE ... -->\` コメントから商品名・価格・説明・タグをコピー
          3. ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.ref_name }}/knowledge/booth-manual-guide.md の手順に従う

          完了したらこのIssueを閉じてください。" \
            --label "bug"
