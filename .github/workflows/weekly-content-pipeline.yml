name: Weekly Content Pipeline (生成→投稿の完全自動)

# 毎週日曜 21:00 UTC (JST月曜6:00) に下記を全自動実行:
#  1. X週次14本AI生成 (3本柱ローテ)
#  2. note記事1本AI生成 (3本柱ローテ) → 翌日に自動投稿
#  3. 第1週・第3週はBOOTH教材1本AI生成 → 翌日に自動出品
# すべてGitHub Models (無料) + Playwright/Graph API (無料)

on:
  schedule:
    - cron: "0 21 * * 0"  # 毎週日曜 21:00 UTC
  workflow_dispatch:
    inputs:
      include_booth:
        description: "BOOTH商品も生成する (通常は隔週)"
        required: false
        type: boolean
        default: false
      pillar_override:
        description: "note記事の柱を強制指定 (A/B/C・空欄でローテ)"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  models: read
  actions: write  # 連鎖ワークフロー起動のため

jobs:
  generate-x-weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: projects/rakuda-sensei/automation/requirements.txt
      - run: pip install -r projects/rakuda-sensei/automation/requirements.txt

      - name: Generate weekly X posts (3本柱対応)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python projects/rakuda-sensei/automation/generate_weekly_x.py

      - name: Commit X weekly
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/rakuda-sensei/sns/weekly/
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): X週次14本生成 (3本柱)"
            git push
          fi

  generate-note-article:
    runs-on: ubuntu-latest
    needs: generate-x-weekly
    outputs:
      article_path: ${{ steps.gen.outputs.article_path }}
      pillar: ${{ steps.gen.outputs.pillar }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - run: git pull --ff-only origin ${{ github.ref_name }} || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: projects/rakuda-sensei/automation/requirements.txt
      - run: pip install -r projects/rakuda-sensei/automation/requirements.txt

      - name: Generate note article (柱ローテ)
        id: gen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PILLAR: ${{ inputs.pillar_override }}
        run: python projects/rakuda-sensei/automation/generate_note_article.py

      - name: Commit note article
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/rakuda-sensei/articles/
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): note記事生成 (柱${{ steps.gen.outputs.pillar }})"
            git push
          fi

  generate-booth-product:
    runs-on: ubuntu-latest
    needs: generate-x-weekly
    if: ${{ inputs.include_booth == true || (github.event_name == 'schedule' && (github.run_number % 2) == 0) }}
    outputs:
      product_path: ${{ steps.gen.outputs.product_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git pull --ff-only origin ${{ github.ref_name }} || true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: projects/rakuda-sensei/automation/requirements.txt
      - run: pip install -r projects/rakuda-sensei/automation/requirements.txt

      - name: Generate BOOTH product (単元ローテ)
        id: gen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python projects/rakuda-sensei/automation/generate_booth_product.py

      - name: Commit BOOTH product
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/rakuda-sensei/products/
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): BOOTH教材生成"
            git push
          fi

  # 生成完了後、note自動投稿ワークフローを起動
  trigger-note-post:
    runs-on: ubuntu-latest
    needs: generate-note-article
    if: needs.generate-note-article.outputs.article_path != ''
    steps:
      - name: Trigger post-to-note workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/post-to-note.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}","inputs":{"article_path":"${{ needs.generate-note-article.outputs.article_path }}","dry_run":false}}'

  # BOOTH自動出品起動
  trigger-booth-post:
    runs-on: ubuntu-latest
    needs: generate-booth-product
    if: needs.generate-booth-product.outputs.product_path != ''
    steps:
      - name: Trigger post-to-booth workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/post-to-booth.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}","inputs":{"product_path":"${{ needs.generate-booth-product.outputs.product_path }}","dry_run":false}}'
