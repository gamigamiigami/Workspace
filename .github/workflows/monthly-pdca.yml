name: Monthly PDCA Report

# 毎月1日 09:00 UTC (JST 18:00) に前月の売上データを分析してレポートを自動生成
# 人間が月初に各管理画面から売上CSVを data/{YYYY-MM}/ にcommitしてから動作する

on:
  schedule:
    - cron: "0 9 1 * *"  # 毎月1日 09:00 UTC
  workflow_dispatch:
    inputs:
      target_month:
        description: "分析対象月 (YYYY-MM形式、省略すると前月)"
        required: false
        type: string

permissions:
  contents: write
  models: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"


jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: projects/rakuda-sensei/automation/requirements.txt

      - name: Install dependencies
        run: pip install -r projects/rakuda-sensei/automation/requirements.txt

      - name: Generate PDCA report (via GitHub Models - 無料)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.target_month }}" ]; then
            python projects/rakuda-sensei/automation/monthly_pdca.py "${{ inputs.target_month }}"
          else
            python projects/rakuda-sensei/automation/monthly_pdca.py
          fi

      - name: Commit PDCA report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/rakuda-sensei/reports/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(automation): 月次PDCAレポート自動生成"
            git push
          fi
