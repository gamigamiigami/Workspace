name: Auto-launch Article (push-triggered)

# 特定のトリガーファイルが push されたら note へ自動投稿する
# 使い方: projects/rakuda-sensei/articles/.launch-trigger に
#   1行目: 記事MDパス
#   2行目: モード (publish / save-draft / dry-run)
# を書いて push すると、この workflow が起動する。
# workflow_dispatch では article_path を直接渡せる。

on:
  push:
    branches:
      - "**"
    paths:
      - "projects/rakuda-sensei/articles/.launch-trigger"
  workflow_dispatch:
    inputs:
      article_path:
        description: "記事MDファイルのパス"
        required: true
        type: string
      mode:
        description: "publish / save-draft / dry-run"
        required: false
        type: choice
        options:
          - publish
          - save-draft
          - dry-run
        default: save-draft

permissions:
  contents: write
  issues: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Parse trigger
        id: trig
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "article_path=${{ inputs.article_path }}" >> $GITHUB_OUTPUT
            echo "mode=${{ inputs.mode }}" >> $GITHUB_OUTPUT
          else
            ARTICLE_PATH=$(sed -n '1p' projects/rakuda-sensei/articles/.launch-trigger | tr -d '\r\n')
            MODE=$(sed -n '2p' projects/rakuda-sensei/articles/.launch-trigger | tr -d '\r\n')
            [ -z "$MODE" ] && MODE="save-draft"
            echo "article_path=$ARTICLE_PATH" >> $GITHUB_OUTPUT
            echo "mode=$MODE" >> $GITHUB_OUTPUT
          fi
          echo "Article: $(cat $GITHUB_OUTPUT | grep article_path)"
          echo "Mode: $(cat $GITHUB_OUTPUT | grep ^mode=)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: projects/rakuda-sensei/automation/requirements.txt

      - run: pip install -r projects/rakuda-sensei/automation/requirements.txt
      - run: playwright install chromium --with-deps

      - name: Post to note
        id: post
        env:
          NOTE_SESSION_COOKIE: ${{ secrets.NOTE_SESSION_COOKIE }}
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
        run: |
          MODE="${{ steps.trig.outputs.mode }}"
          ARTICLE="${{ steps.trig.outputs.article_path }}"
          FLAG=""
          case "$MODE" in
            dry-run)    FLAG="--dry-run" ;;
            save-draft) FLAG="--save-draft" ;;
            publish)    FLAG="" ;;
          esac
          python projects/rakuda-sensei/automation/post_to_note.py "$ARTICLE" $FLAG

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-post-screenshots
          path: projects/rakuda-sensei/automation/screenshots/
          if-no-files-found: ignore

      - name: Apply published URL to cross-posts
        if: success() && steps.trig.outputs.mode == 'publish'
        run: |
          URL_FILE="projects/rakuda-sensei/articles/.last-published-url.txt"
          if [ -f "$URL_FILE" ]; then
            URL=$(head -1 "$URL_FILE" | tr -d '\r\n')
            echo "🔗 公開URL: $URL"
            python3 projects/rakuda-sensei/automation/replace_article_url.py "$URL" || true
          else
            echo "⚠️  公開URLファイル無し（URL取得スキップ）"
          fi

      - name: Trigger cross-post promo (X / Threads)
        if: success() && steps.trig.outputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sleep 30
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/post-note-promo.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}","inputs":{"dry_run":false}}' || true

      - name: Remove trigger file and commit URL
        if: github.event_name == 'push' && success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/rakuda-sensei/articles/.last-published-url.txt 2>/dev/null || true
          git add projects/rakuda-sensei/sns/cross-posts/ 2>/dev/null || true
          git rm projects/rakuda-sensei/articles/.launch-trigger || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): launch-trigger消化 + 公開URL反映"
            for i in 1 2 3; do
              git pull --rebase origin "${{ github.ref_name }}" || true
              git push && break
              sleep $((i * 3))
            done
          fi

      - name: Notify completion via Issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODE="${{ steps.trig.outputs.mode }}"
          ARTICLE="${{ steps.trig.outputs.article_path }}"
          if [ "$MODE" = "save-draft" ]; then
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "📝 note下書き保存完了 → 5分の最終仕上げ: $(basename $ARTICLE .md)" \
              --body "$(cat <<'BODY'
          記事 \`${{ steps.trig.outputs.article_path }}\` を note に下書き保存しました。
          以下の5分の作業で公開できます。

          ## ① note にログイン
          [マイページ → 下書き一覧](https://note.com/notes/manage/draft) を開く

          ## ② Excelファイルを添付
          下書きを開いて、ペイウォール直下の \`[ここに note の有料ファイル添付機能でアップロード]\` の場所に
          \`projects/rakuda-sensei/products/digital/夫婦で実践｜サイドFIRE計画シート.xlsx\` を添付

          ## ③ SNSプロモ機能で割引設定
          販売設定 → SNSプロモーション機能 を ON → 割引価格 **¥500** → RT連携文を貼り付け：

          \`\`\`
          公務員夫婦のサイドFIRE達成診断シート、買いました。
          入力11項目で「あと月いくら積立増やせば達成？」が自動で出てくるExcel。
          夫婦の家計会議で使えます🐪
          \`\`\`

          ## ④ 公開ボタンを押す

          ## ⑤ 公開後のURLを以下のコマンドで反映（任意・SNS告知用）
          \`\`\`bash
          python3 projects/rakuda-sensei/automation/replace_article_url.py \\
            <公開URL>
          \`\`\`

          完了したらこのIssueをクローズしてください。
          BODY
          )"
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "✅ note記事自動投稿完了: $(basename $ARTICLE .md)" \
              --body "記事 \`$ARTICLE\` を note に投稿しました。詳細はActionsログを参照。"
          fi
