name: Post to Instagram

# Instagram投稿（画像必須・Meta Graph API使用）
# 事前準備: setup/meta-api-setup.md 参照
#   - META_ACCESS_TOKEN
#   - IG_USER_ID

on:
  workflow_dispatch:
    inputs:
      post_path:
        description: "投稿MDファイルのパス (例: projects/rakuda-sensei/sns/instagram/001.md)"
        required: true
        type: string
      dry_run:
        description: "Dry run"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"


jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: projects/rakuda-sensei/automation/requirements.txt
      - run: pip install -r projects/rakuda-sensei/automation/requirements.txt

      - name: Post to Instagram
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: |
          DRY=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY="--dry-run"
          fi
          python projects/rakuda-sensei/automation/post_to_instagram.py \
            "${{ inputs.post_path }}" $DRY

      - name: Commit status update
        if: success() && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/rakuda-sensei/sns/instagram/
          if ! git diff --staged --quiet; then
            git commit -m "chore(automation): Instagram投稿ステータス更新"
            git push
          fi
