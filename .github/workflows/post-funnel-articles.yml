name: ファネル記事を一括投稿

# 通知表・サイドFIREのファネル記事8本をnoteに順番に投稿する
# 使い方: GitHub Actions > "ファネル記事を一括投稿" > Run workflow

on:
  workflow_dispatch:
    inputs:
      funnel:
        description: "投稿するファネル"
        required: true
        type: choice
        options:
          - 通知表（A→B→C→D）
          - サイドFIRE（A→B→C→D）
          - 全部（8本）
        default: "全部（8本）"
      dry_run:
        description: "Dry run（テスト投稿・実際には投稿しない）"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  post-通知表-A:
    if: ${{ inputs.funnel == '通知表（A→B→C→D）' || inputs.funnel == '全部（8本）' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: projects/rakuda-sensei/automation/requirements.txt
      - run: pip install -r projects/rakuda-sensei/automation/requirements.txt
      - run: playwright install chromium --with-deps
      - name: 通知表A（共感）を投稿
        env:
          NOTE_SESSION_COOKIE: ${{ secrets.NOTE_SESSION_COOKIE }}
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
        run: |
          DRY_RUN_FLAG=${{ inputs.dry_run == true && '--dry-run' || '' }}
          python projects/rakuda-sensei/automation/post_to_note.py \
            "projects/rakuda-sensei/articles/funnel-通知表-A-共感.md" \
            $DRY_RUN_FLAG
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-通知表-A
          path: "*.png"
          if-no-files-found: ignore
          retention-days: 3

  post-通知表-B:
    if: ${{ inputs.funnel == '通知表（A→B→C→D）' || inputs.funnel == '全部（8本）' }}
    needs: post-通知表-A
    runs-on: ubuntu-latest
