name: Post to Threads

# JST 7:00 / 21:00 にXと同じスロットのツイートをThreadsに自動投稿
# 事前準備: setup/meta-api-setup.md 参照
#   - THREADS_ACCESS_TOKEN
#   - THREADS_USER_ID

on:
  schedule:
    - cron: "0 22 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      text:
        description: "任意テキスト（指定するとweeklyファイル無視）"
        required: false
        type: string
        default: ""
      force:
        description: "既投稿でも強制投稿"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry run"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: projects/rakuda-sensei/automation/requirements.txt
      - run: pip install -r projects/rakuda-sensei/automation/requirements.txt

      - name: Post to Threads
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.text }}" ]; then
            ARGS="$ARGS --text \"${{ inputs.text }}\""
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          eval python projects/rakuda-sensei/automation/post_to_threads.py $ARGS

      - name: Commit posted log
        if: success() && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/rakuda-sensei/sns/.threads-posted.log
          if ! git diff --staged --quiet; then
            git commit -m "chore(automation): Threads投稿ログ更新"
            git push
          fi
