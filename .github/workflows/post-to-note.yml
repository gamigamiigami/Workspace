name: Post Article to note.com

# 記事MDファイルをnote.comに自動投稿する（自動ログイン版）
# 使い方: GitHub Actions > "Post Article to note.com" > Run workflow
# 事前準備: GitHub Secret に NOTE_EMAIL と NOTE_PASSWORD を登録するだけ

on:
  workflow_dispatch:
    inputs:
      article_path:
        description: "記事MDファイルのパス (例: projects/rakuda-sensei/articles/001-time-saving-routine.md)"
        required: true
        type: string
      dry_run:
        description: "Dry run（実際には投稿しない・テスト用）"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"


jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: projects/rakuda-sensei/automation/requirements.txt

      - name: Install dependencies
        run: pip install -r projects/rakuda-sensei/automation/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Post to note.com
        env:
          NOTE_SESSION_COOKIE: ${{ secrets.NOTE_SESSION_COOKIE }}
          NOTE_EMAIL: ${{ secrets.NOTE_EMAIL }}
          NOTE_PASSWORD: ${{ secrets.NOTE_PASSWORD }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python projects/rakuda-sensei/automation/post_to_note.py \
            "${{ inputs.article_path }}" \
            $DRY_RUN_FLAG

      - name: Upload screenshots (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note-post-screenshots
          path: "*.png"
          if-no-files-found: ignore
          retention-days: 7

      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🚨 note記事投稿失敗 ($(date +%Y-%m-%d))" \
            --body "note記事の自動投稿が失敗しました。

          - **記事**: \`${{ inputs.article_path }}\`
          - **実行ログ**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ## 対応
          1. ArtifactのスクリーンショットでUI状態を確認
          2. note.com のエディタ仕様変更ならセレクタ更新
          3. 認証エラーならパスワード/2FA設定を確認" \
            --label "bug"
