name: Post Article to note.com

# 記事MDファイルをnote.comに自動投稿する
# 使い方: GitHub Actions > "Post Article to note.com" > Run workflow
# 事前準備: setup/cookie-setup-guide.md を参照してNOTE_SESSION_COOKIEを設定

on:
  workflow_dispatch:
    inputs:
      article_path:
        description: "記事MDファイルのパス (例: projects/rakuda-sensei/articles/001-time-saving-routine.md)"
        required: true
        type: string
      dry_run:
        description: "Dry run（実際には投稿しない・テスト用）"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: projects/rakuda-sensei/automation/requirements.txt

      - name: Install dependencies
        run: pip install -r projects/rakuda-sensei/automation/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Post to note.com
        env:
          NOTE_SESSION_COOKIE: ${{ secrets.NOTE_SESSION_COOKIE }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          python projects/rakuda-sensei/automation/post_to_note.py \
            "${{ inputs.article_path }}" \
            $DRY_RUN_FLAG

      - name: Upload error screenshot (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: note-post-screenshot
          path: "*.png"
          if-no-files-found: ignore
