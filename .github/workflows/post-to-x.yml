name: Post Tweet to X

# JST 7:00 と 21:00 に該当スロットのツイートを自動投稿する
# 事前準備: GitHub Secret に X_USERNAME と X_PASSWORD を登録
#
# 既知のリスク: Xは自動化を検知すると一時的にアカウントロックすることがある
# 失敗時はX native scheduler (公式機能・無料) にフォールバック可能

on:
  schedule:
    # 1日3投稿戦略 (2026-06-01)
    # 22:00 UTC = 07:00 JST 翌日 (朝スロット)
    - cron: "0 22 * * *"
    # 03:30 UTC = 12:30 JST 当日 (昼スロット・休み時間狙い)
    - cron: "30 3 * * *"
    # 12:00 UTC = 21:00 JST 当日 (夜スロット)
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "既に投稿済みでも強制投稿"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Dry run（実際には投稿しない）"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"


jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: projects/rakuda-sensei/automation/requirements.txt

      - name: Install dependencies
        run: pip install -r projects/rakuda-sensei/automation/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: Post tweet to X
        env:
          X_SESSION_COOKIE: ${{ secrets.X_SESSION_COOKIE }}
          X_USERNAME: ${{ secrets.X_USERNAME }}
          X_PASSWORD: ${{ secrets.X_PASSWORD }}
        run: |
          FLAGS=""
          if [ "${{ inputs.force }}" = "true" ]; then
            FLAGS="$FLAGS --force"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          python projects/rakuda-sensei/automation/post_to_x.py $FLAGS

      - name: Commit posted log
        if: success() && inputs.dry_run != true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/rakuda-sensei/sns/.x-posted.log
          if git diff --staged --quiet; then
            echo "No log changes"
          else
            git commit -m "chore(automation): X投稿ログ更新"
            for i in 1 2 3 4 5; do
              git pull --rebase origin "${{ github.ref_name }}" || true
              if git push; then
                exit 0
              fi
              sleep $((i * 2))
            done
            exit 1
          fi

      - name: Upload error screenshot (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: x-post-screenshot
          path: "*.png"
          if-no-files-found: ignore

      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🚨 X投稿失敗 ($(date +%Y-%m-%d_%H:%M))" \
            --body "X(Twitter)への自動投稿が失敗しました。

          ## 考えられる原因
          - X側でアカウントが一時ロックされた（手動ログインで解除必要）
          - 認証コード要求（メール確認が必要）
          - X UIの変更（セレクタ要更新）
          - X_USERNAME / X_PASSWORD が正しくない

          ## 対応
          1. 実行ログのArtifactにあるスクリーンショットを確認
          2. 必要なら手動でXにログインしてロック解除
          3. それでも継続失敗するならX native scheduler に切替

          **実行ログ**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "bug"
