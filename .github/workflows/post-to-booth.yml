name: List Product on BOOTH (実験的・手動運用推奨)

# ⚠️ BOOTH UI 変更が頻繁で安定動作しないため、手動運用を推奨。
# 詳細: knowledge/booth-manual-guide.md
# このワークフローは workflow_dispatch のみ（試行用に残置）。

# BOOTH商品を自動出品する（自動ログイン版）
# 使い方: GitHub Actions > "List Product on BOOTH" > Run workflow
# 事前準備: GitHub Secret に PIXIV_EMAIL と PIXIV_PASSWORD を登録するだけ

on:
  workflow_dispatch:
    inputs:
      product_path:
        description: "商品HTMLファイルのパス"
        required: true
        type: string
      pdf_path:
        description: "添付PDFのパス（省略可）"
        required: false
        type: string
        default: ""
      title:
        description: "商品タイトル（HTMLコメント優先・省略可）"
        required: false
        type: string
        default: ""
      price:
        description: "価格（円）（HTMLコメント優先・省略可）"
        required: false
        type: number
        default: 0
      dry_run:
        description: "Dry run"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"


jobs:
  list:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: projects/rakuda-sensei/automation/requirements.txt

      - name: Install dependencies
        run: pip install -r projects/rakuda-sensei/automation/requirements.txt

      - name: Install Playwright browsers
        run: playwright install chromium --with-deps

      - name: List product on BOOTH
        env:
          BOOTH_SESSION_COOKIE: ${{ secrets.BOOTH_SESSION_COOKIE }}
          PIXIV_EMAIL: ${{ secrets.PIXIV_EMAIL }}
          PIXIV_PASSWORD: ${{ secrets.PIXIV_PASSWORD }}
          INPUT_PRODUCT_PATH: ${{ inputs.product_path }}
          INPUT_PDF_PATH: ${{ inputs.pdf_path }}
          INPUT_TITLE: ${{ inputs.title }}
          INPUT_PRICE: ${{ inputs.price }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ARGS=("$INPUT_PRODUCT_PATH")
          [ -n "$INPUT_PDF_PATH" ] && ARGS+=(--pdf "$INPUT_PDF_PATH")
          [ -n "$INPUT_TITLE" ]    && ARGS+=(--title "$INPUT_TITLE")
          [ -n "$INPUT_PRICE" ] && [ "$INPUT_PRICE" != "0" ] && ARGS+=(--price "$INPUT_PRICE")
          [ "$INPUT_DRY_RUN" = "true" ] && ARGS+=(--dry-run)
          python projects/rakuda-sensei/automation/post_to_booth.py "${ARGS[@]}"

      - name: Upload screenshots (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: booth-post-screenshots
          path: "*.png"
          if-no-files-found: ignore
          retention-days: 7

      - name: Create issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "🚨 BOOTH出品失敗 ($(date +%Y-%m-%d))" \
            --body "BOOTH商品の自動出品が失敗しました。

          - **商品**: \`${{ inputs.product_path }}\`
          - **実行ログ**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          ## 対応
          1. Artifactのスクリーンショットを確認
          2. BOOTH/pixiv UI変更ならセレクタ更新
          3. pixiv認証エラーならパスワード確認" \
            --label "bug"
